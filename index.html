<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Manager</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Field Manager" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="theme-color"
      content="#f5f6f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#16181c"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      /* Apply saved theme before first paint to avoid a flash. */
      (function () {
        try {
          var t = localStorage.getItem("fieldmanager.theme.v1");
          if (t === "light" || t === "dark")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --card: #ffffff;
        --border: #e3e6ea;
        --text: #1c1f23;
        --muted: #6b7280;
        --accent: #2563eb;
        --ok: #16a34a;
        --under: #dc2626;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #16181c;
          --card: #1f2227;
          --border: #2c3036;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --accent: #3b82f6;
          --ok: #22c55e;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #16181c;
        --card: #1f2227;
        --border: #2c3036;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #3b82f6;
        --ok: #22c55e;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 780px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .theme-btn {
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        width: 36px;
        height: 36px;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .theme-btn:hover {
        border-color: var(--accent);
      }
      h1 {
        font-size: 22px;
        font-weight: 650;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .summary {
        font-size: 13px;
        color: var(--muted);
      }
      .summary b {
        color: var(--text);
        font-weight: 600;
      }
      section {
        margin-top: 28px;
      }
      .section-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 12px 2px;
      }
      .tr-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .tr-chevron {
        font-size: 10px;
        color: var(--muted);
      }
      .tr-count {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }
      /* Section heading with the area switcher parked on the right. */
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px 2px;
      }
      .section-head .section-title {
        margin: 0;
      }
      .area-switch {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 0 1 auto;
        min-width: 0;
      }
      .area-switch select {
        padding: 5px 9px;
        font-size: 13px;
        font-weight: 500;
        max-width: 200px;
      }
      /* Add / toolbar */
      .add-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .add-row input[type="text"] {
        flex: 1;
      }
      input[type="text"],
      input[type="number"],
      input[type="time"],
      select {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 11px;
        outline: none;
        transition: border-color 0.12s;
      }
      input:focus,
      select:focus {
        border-color: var(--accent);
      }
      input[type="number"] {
        width: 62px;
        text-align: center;
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        transition:
          background 0.12s,
          opacity 0.12s,
          border-color 0.12s,
          color 0.12s;
      }
      .btn-add {
        background: var(--accent);
        color: #fff;
        font-weight: 550;
        padding: 9px 18px;
        white-space: nowrap;
      }
      .btn-add:hover {
        opacity: 0.9;
      }
      .btn-move {
        background: var(--card);
        color: var(--text);
        font-weight: 550;
        padding: 9px 16px;
        border: 1px solid var(--border);
        white-space: nowrap;
      }
      .btn-move:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-move.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* Move modal */
      .move-cols {
        display: flex;
        align-items: stretch;
        gap: 12px;
      }
      .move-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      /* Sits between the two columns, pointing from source to destination. */
      .move-cols .arrow {
        align-self: center;
        color: var(--muted);
        font-size: 16px;
        padding-top: 14px;
      }
      .picker {
        margin-top: 4px;
        flex: 1 1 auto;
        max-height: 216px;
        overflow-y: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .picker-option {
        width: 100%;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 11px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        color: var(--text);
        font: inherit;
        font-weight: 500;
        text-align: left;
      }
      .picker-option:last-child {
        border-bottom: 0;
      }
      .picker-option:hover {
        background: var(--card);
      }
      .picker-option:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      /* Listed after :hover, and matching it on specificity, so a hovered
         selection keeps its accent fill instead of going white-on-white. */
      .picker-option[aria-pressed="true"],
      .picker-option[aria-pressed="true"]:hover {
        background: var(--accent);
        color: #fff;
      }
      .picker-option .nm {
        overflow-wrap: anywhere;
        line-height: 1.35;
      }
      .picker-option .staff {
        flex: none;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .picker-option[aria-pressed="true"] .staff {
        color: rgba(255, 255, 255, 0.8);
      }
      /* Out-of-area locations live behind a collapsed header, so your own
         list stays the thing you actually read. */
      .picker-group {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 11px;
        background: transparent;
        border: 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: left;
      }
      .picker-group:hover {
        color: var(--text);
      }
      .picker-group:first-child {
        border-top: 0;
      }
      .picker-group .gx {
        font-size: 9px;
        flex: none;
      }
      .picker-group .gn {
        text-transform: none;
        letter-spacing: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .picker-group .gc {
        margin-left: auto;
        font-weight: 500;
        flex: none;
      }
      .picker-option.nested {
        padding-left: 22px;
      }
      .picker-add {
        width: 100%;
        display: block;
        margin-top: 6px;
        padding: 7px 10px;
        background: transparent;
        border: 1px dashed var(--border);
        border-radius: 8px;
        color: var(--accent);
        font: inherit;
        font-size: 12.5px;
        font-weight: 500;
        text-align: left;
      }
      .picker-add:hover {
        border-color: var(--accent);
      }
      .picker-none {
        font-size: 13px;
        color: var(--muted);
        padding: 10px 11px;
      }
      .area-tag {
        color: var(--muted);
        font-weight: 500;
      }
      .picker-option[aria-pressed="true"] .area-tag {
        color: rgba(255, 255, 255, 0.8);
      }
      .picker-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .move-count {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
      }
      .move-count label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .move-count input {
        background: var(--bg);
      }
      .move-summary {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        color: var(--muted);
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .btn-confirm {
        background: var(--accent);
        color: #fff;
        font-weight: 550;
        padding: 9px 16px;
      }
      .btn-confirm:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn-confirm:disabled:hover {
        filter: none;
      }
      .btn-confirm:hover {
        opacity: 0.9;
      }
      /* Location cards */
      .locations {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .loc {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .loc-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
      }
      /* Grouping wrappers exist only so the narrow layout can position them;
         on wide screens they dissolve into the surrounding flex row. */
      .loc-stats,
      .loc-actions,
      .cell {
        display: contents;
      }
      .cell-label {
        display: none;
      }
      .exp {
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex: none;
      }
      .loc-title {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        cursor: pointer;
      }
      .loc-title-main {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        row-gap: 4px;
        max-width: 100%;
        min-width: 0;
      }
      .loc-name {
        font-weight: 550;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        /* Yields before the manager's name, but never all the way to nothing. */
        flex: 0 4 auto;
        min-width: 5em;
      }
      .shift-count {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        flex: none;
      }
      .loan {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        flex: none;
        white-space: nowrap;
      }
      .loan.in {
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 14%, transparent);
      }
      .loan.out {
        color: var(--under);
        background: color-mix(in srgb, var(--under) 14%, transparent);
      }
      .field {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        flex: none;
      }
      .field label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .field .val {
        font-weight: 600;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .diff {
        min-width: 54px;
        text-align: center;
        font-weight: 700;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        padding: 6px 8px;
        border-radius: 8px;
      }
      .diff.matched {
        color: var(--text);
        background: color-mix(in srgb, var(--muted) 16%, transparent);
      }
      .diff.under {
        color: var(--under);
        background: color-mix(in srgb, var(--under) 12%, transparent);
      }
      .diff.over {
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 12%, transparent);
      }
      .btn-del {
        background: transparent;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        padding: 6px 8px;
        border-radius: 6px;
        flex: none;
      }
      .btn-del:hover {
        color: var(--under);
        background: color-mix(in srgb, var(--under) 12%, transparent);
      }
      .btn-edit {
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        padding: 6px 8px;
        border-radius: 6px;
        flex: none;
      }
      .btn-edit:hover,
      .btn-edit.active {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      /* Shifts panel */
      .shifts {
        padding: 4px 16px 16px 50px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid var(--border);
        margin-top: 2px;
      }
      .shifts-head,
      .shift {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .shifts-head {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
        padding-top: 10px;
      }
      .col-times {
        /* Wide enough for two time inputs, the dash, and the "now" badge that
           marks the running shift. The badge keeps its space on every row even
           when hidden, so the time inputs align down the panel. The shifts
           header shares this class, so the columns stay aligned. */
        width: 248px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .col-times input[type="time"] {
        flex: 1;
        min-width: 0;
        padding: 8px 6px;
      }
      .dash {
        color: var(--muted);
        flex: none;
      }
      .col-num {
        width: 62px;
        flex: none;
        text-align: center;
      }
      input[type="number"].col-num {
        width: 62px;
      }
      .col-diff {
        width: 56px;
        flex: none;
        min-width: 0;
      }
      .shifts-head .col-diff {
        text-align: center;
      }
      .col-del {
        width: 34px;
        flex: none;
      }
      .btn-shift {
        align-self: flex-start;
        background: transparent;
        color: var(--accent);
        font-weight: 550;
        padding: 7px 12px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        font-size: 13px;
        margin-top: 2px;
      }
      .btn-shift:hover {
        border-color: var(--accent);
      }
      .no-shifts {
        font-size: 13px;
        color: var(--muted);
        padding: 8px 0 2px;
      }
      .loc-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .loc-field label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .loc-field input {
        width: 100%;
        background: var(--bg);
      }
      .loc-manager {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        flex: 0 1 auto;
        min-width: 2.5em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .standby-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        flex: none;
        white-space: nowrap;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .loc-standby {
        padding-top: 8px;
        margin-top: 4px;
        border-top: 1px solid var(--border);
      }
      .loc-standby-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 4px;
      }
      .loc-standby-item {
        font-size: 13px;
        color: var(--text);
      }
      /* Standby teams section */
      .teams {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .team {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        box-shadow: var(--shadow);
      }
      .team .mini {
        font-size: 13px;
        color: var(--muted);
      }
      .team .arrow {
        color: var(--muted);
      }
      .team select {
        flex: 1;
        min-width: 0;
        background: var(--bg);
      }
      .teams-empty {
        font-size: 13px;
        color: var(--muted);
        padding: 2px 0 4px;
      }
      .btn-team {
        align-self: flex-start;
        background: transparent;
        color: var(--accent);
        font-weight: 550;
        padding: 8px 12px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        font-size: 13px;
      }
      .btn-team:hover {
        border-color: var(--accent);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        padding: 28px 0;
        border: 1px dashed var(--border);
        border-radius: 12px;
      }
      /* Transfers list */
      .transfers {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .transfer {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        box-shadow: var(--shadow);
      }
      .transfer .route {
        flex: 1;
        font-size: 14px;
        min-width: 0;
      }
      .transfer .route b {
        font-weight: 600;
      }
      .transfer .route .via {
        color: var(--muted);
        margin: 0 6px;
      }
      .transfer .cnt {
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .transfer .cnt b {
        color: var(--text);
        font-weight: 600;
      }
      /* Notes */
      textarea {
        width: 100%;
        min-height: 160px;
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        outline: none;
        resize: vertical;
        box-shadow: var(--shadow);
        transition: border-color 0.12s;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        justify-content: center;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 20px;
        z-index: 100;
        animation: modal-fade 0.12s ease-out;
      }
      .modal-overlay > * {
        margin: auto;
      }
      .modal {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 12px 44px rgba(0, 0, 0, 0.3);
        max-width: 380px;
        width: 100%;
        padding: 22px 22px 18px;
        animation: modal-pop 0.13s ease-out;
      }
      .modal-wide {
        max-width: 600px;
      }
      .modal h2 {
        font-size: 17px;
        font-weight: 650;
        margin: 0 0 8px;
      }
      .modal p {
        font-size: 14px;
        color: var(--muted);
        margin: 0 0 20px;
        line-height: 1.5;
      }
      .modal-fields {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin: 4px 0 22px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .btn-ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 9px 16px;
        font-weight: 500;
      }
      .btn-ghost:hover {
        border-color: var(--muted);
      }
      .btn-danger {
        background: var(--under);
        color: #fff;
        font-weight: 550;
        padding: 9px 16px;
      }
      .btn-danger:hover {
        opacity: 0.9;
      }
      @keyframes modal-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes modal-pop {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
      }
      /* ---------- Narrow screens ---------- */
      @media (max-width: 760px) {
        .wrap {
          padding: 20px 14px 64px;
        }
        h1 {
          font-size: 20px;
        }
        header {
          gap: 10px;
        }
        .header-right {
          flex: 1 1 100%;
          justify-content: space-between;
          gap: 10px;
        }

        /* Add row: the field takes a full line, the buttons split the next. */
        .add-row {
          flex-wrap: wrap;
        }
        .add-row input[type="text"] {
          flex: 1 1 100%;
        }
        .add-row .btn-add,
        .add-row .btn-move {
          flex: 1 1 0;
          padding: 11px 12px;
        }

        /* Location header: name + actions on top, stats on their own row. */
        .loc-head {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr) auto;
          grid-template-areas:
            "exp   title actions"
            "stats stats stats";
          align-items: start;
          column-gap: 10px;
          row-gap: 0;
          padding: 12px 14px 0;
        }
        /* 20px tall, so the glyph centres on the first line of the name. */
        .exp {
          grid-area: exp;
          width: 24px;
          height: 20px;
          margin-left: -4px;
        }
        .loc-title {
          grid-area: title;
          min-width: 0;
          gap: 2px;
        }
        .loc-title-main {
          flex-wrap: wrap;
          gap: 4px 8px;
        }
        .loc-name {
          white-space: normal;
          overflow: visible;
          overflow-wrap: anywhere;
          line-height: 1.3;
        }
        .loc-manager {
          white-space: normal;
          overflow: visible;
        }
        .loc-actions {
          grid-area: actions;
          display: flex;
          align-items: center;
          gap: 0;
          margin: -4px -6px 0 0;
        }
        .loc-actions .btn-edit,
        .loc-actions .btn-del {
          height: 32px;
          padding: 0 9px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .loc-stats {
          grid-area: stats;
          display: flex;
          align-items: flex-start;
          gap: 6px;
          margin-top: 11px;
          padding: 11px 0 12px;
          border-top: 1px solid var(--border);
        }
        .loc-stats .field {
          flex: 1 1 0;
          min-width: 0;
          gap: 5px;
        }
        .loc-stats .field .val,
        .loc-stats .diff {
          width: 100%;
          min-width: 0;
          max-width: 130px;
          height: 32px;
          padding: 0 6px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        /* Shifts: one card per shift, with the column header inlined as
           per-control labels. */
        .shifts {
          padding: 8px 12px 14px;
          gap: 10px;
        }
        .shifts-head {
          display: none;
        }
        .shift {
          display: grid;
          grid-template-columns:
            minmax(0, 1fr) minmax(0, 1fr)
            minmax(0, 1fr) auto;
          grid-template-areas:
            "times   times  times times"
            "planned actual diff  del";
          align-items: end;
          column-gap: 8px;
          row-gap: 10px;
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 10px;
        }
        .shift .col-times {
          grid-area: times;
          width: auto;
          max-width: 320px;
          gap: 6px;
        }
        .shift .col-times input[type="time"] {
          padding: 9px 4px;
          text-align: center;
        }
        .shift > .btn-del.col-del {
          grid-area: del;
          width: auto;
          height: 40px;
          padding: 0 8px;
          margin-right: -2px;
          align-self: end;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .shift .cell {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 3px;
          min-width: 0;
        }
        .shift .cell-planned {
          grid-area: planned;
        }
        .shift .cell-actual {
          grid-area: actual;
        }
        .shift .cell-diff {
          grid-area: diff;
        }
        .cell-label {
          display: block;
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          color: var(--muted);
          font-weight: 600;
          line-height: 1.4;
        }
        .shift .cell input[type="number"].col-num {
          width: 100%;
          max-width: 130px;
          height: 40px;
          padding: 9px 6px;
        }
        .shift .cell .diff {
          width: 100%;
          min-width: 0;
          max-width: 130px;
          height: 40px;
          padding: 0 4px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .btn-shift {
          padding: 9px 14px;
        }

        /* Move modal: the two pickers stack, so the arrow steps downward. */
        .move-cols {
          flex-direction: column;
          gap: 10px;
        }
        .move-cols .arrow {
          padding-top: 0;
          line-height: 1;
          transform: rotate(90deg);
        }
        .picker {
          max-height: 168px;
        }
        .move-count {
          flex-wrap: wrap;
          margin-top: 14px;
        }
        /* Too little room to sit beside the stepper without truncating. */
        .move-summary {
          flex: 1 1 100%;
          text-align: left;
          white-space: normal;
        }

        /* Standby teams: team size on top, destination on its own full-width
           line below. The arrow that joins the two on one row has nothing left
           to join, so it goes. */
        .team {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr) auto;
          grid-template-areas:
            "size label del"
            "loc  loc   loc";
          align-items: center;
          column-gap: 8px;
          row-gap: 10px;
          padding: 10px 12px;
        }
        .team > input[type="number"] {
          grid-area: size;
        }
        .team > .mini {
          grid-area: label;
        }
        .team > .arrow {
          display: none;
        }
        .team .cell-team-loc {
          grid-area: loc;
          display: flex;
          flex-direction: column;
          gap: 3px;
          min-width: 0;
        }
        .team .cell-team-loc select {
          width: 100%;
        }
        .team > .btn-del {
          grid-area: del;
          height: 34px;
          padding: 0 9px;
          margin-right: -4px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .transfer {
          gap: 8px;
          padding: 10px 12px;
        }
        .modal-overlay {
          padding: 14px;
        }
      }
      /* ---------- Toolbar: view, search, filter, sort, copy ---------- */
      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .toolbar input[type="search"] {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 11px;
        outline: none;
        flex: 1 1 150px;
        min-width: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      .toolbar input[type="search"]:focus {
        border-color: var(--accent);
      }
      .toolbar select {
        padding: 6px 9px;
        font-size: 13px;
        font-weight: 500;
        flex: none;
      }
      .btn-copy {
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 550;
        padding: 7px 13px;
        border: 1px solid var(--border);
        white-space: nowrap;
        flex: none;
      }
      .btn-copy:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* Segmented control. The pressed segment carries the accent fill, so the
         current view/filter reads at a glance on a bright field. */
      .seg {
        display: flex;
        flex: none;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg-btn {
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 550;
        padding: 7px 12px;
        border: 0;
        border-radius: 0;
        white-space: nowrap;
      }
      .seg-btn + .seg-btn {
        border-left: 1px solid var(--border);
      }
      .seg-btn:hover {
        color: var(--text);
      }
      .seg-btn[aria-pressed="true"],
      .seg-btn[aria-pressed="true"]:hover {
        background: var(--accent);
        color: #fff;
      }
      .seg-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      /* "Showing 3 of 12" — only present while a filter is narrowing things. */
      .list-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin: 0 2px 10px;
      }
      .list-meta button {
        background: transparent;
        border: 0;
        padding: 0;
        color: var(--accent);
        font: inherit;
        font-weight: 550;
      }
      .list-meta button:hover {
        text-decoration: underline;
      }
      /* ---------- Now view ---------- */
      /* Upcoming changeover. Muted until it is close enough to act on. */
      .next-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        flex: none;
        white-space: nowrap;
        color: var(--muted);
        background: color-mix(in srgb, var(--muted) 12%, transparent);
      }
      .next-chip.soon {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .shift-count.closed {
        color: var(--muted);
        font-style: italic;
      }
      /* The shift that is actually running, marked inside the panel so the
         numbers on the card head can be traced to a row. */
      .shift.is-now {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .now-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 999px;
        color: #fff;
        background: var(--accent);
        flex: none;
        white-space: nowrap;
      }
      .btn-dup {
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        padding: 6px 8px;
        border-radius: 6px;
        flex: none;
      }
      .btn-dup:hover,
      .btn-edit:hover {
        color: var(--accent);
      }
      /* Timestamp on a transfer row, so the log reads as a sequence of moves. */
      .tr-time {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      /* Over-transfer guard in the move dialog. */
      .move-summary.warn {
        color: var(--under);
        font-weight: 600;
      }
      /* ---------- Toasts ---------- */
      .toasts {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 0 14px 18px;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: 420px;
        width: 100%;
        background: var(--text);
        color: var(--bg);
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 13.5px;
        font-weight: 500;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
        animation: toast-in 0.16s ease-out;
      }
      .toast.out {
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.18s,
          transform 0.18s;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .toast-msg {
        flex: 1 1 auto;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .toast-btn {
        flex: none;
        background: transparent;
        border: 0;
        padding: 2px 4px;
        color: var(--bg);
        font: inherit;
        font-weight: 700;
        text-decoration: underline;
      }
      @media (prefers-reduced-motion: reduce) {
        .toast {
          animation: none;
        }
      }
      @media (max-width: 760px) {
        /* Search takes its own line so the segmented controls stay unsplit. */
        .toolbar input[type="search"] {
          flex: 1 1 100%;
          order: -1;
        }
        /* Wrapped rows push apart, so the filter and Copy summary end up flush
           with the right edge and their borders line up down the column. */
        .toolbar {
          justify-content: space-between;
        }
        /* Holds the right edge on a row Copy summary has to itself. */
        .btn-copy {
          margin-left: auto;
        }
        .toasts {
          padding: 0 10px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Field Manager</h1>
        <div class="header-right">
          <div class="summary" id="summary"></div>
          <button
            class="theme-btn"
            id="theme-btn"
            aria-label="Toggle color theme"
          >
            ☀
          </button>
        </div>
      </header>

      <section>
        <div class="section-head">
          <p class="section-title">Locations</p>
          <div class="area-switch">
            <span class="picker-label" id="area-label">Area</span>
            <select id="area-select" aria-labelledby="area-label"></select>
          </div>
        </div>
        <div class="add-row">
          <input
            type="text"
            id="new-name"
            placeholder="Add a location (e.g. Drinks 1, Speciaalbierbar)"
            autocomplete="off"
          />
          <button class="btn-add" id="add-btn">Add</button>
          <button class="btn-move" id="move-btn">Move</button>
        </div>
        <div class="toolbar">
          <div class="seg" id="view-seg" role="group" aria-label="View">
            <button class="seg-btn" type="button" data-view="now">Now</button>
            <button class="seg-btn" type="button" data-view="day">
              All day
            </button>
          </div>
          <input
            type="search"
            id="search"
            placeholder="Search name or manager…"
            autocomplete="off"
            aria-label="Search locations"
          />
          <div class="seg" id="filter-seg" role="group" aria-label="Filter">
            <button class="seg-btn" type="button" data-filter="all">All</button>
            <button class="seg-btn" type="button" data-filter="short">
              Short
            </button>
            <button class="seg-btn" type="button" data-filter="ok">OK</button>
          </div>
          <select id="sort-select" aria-label="Sort locations">
            <option value="manual">Order added</option>
            <option value="worst">Most short first</option>
            <option value="name">Name A–Z</option>
          </select>
          <button class="btn-copy" id="copy-btn">Copy summary</button>
        </div>
        <div class="list-meta" id="list-meta" style="display: none"></div>
        <div class="locations" id="locations"></div>
      </section>

      <section id="transfers-section" style="display: none">
        <p class="section-title tr-toggle" id="transfers-toggle">
          <span class="tr-chevron" id="transfers-chevron">▾</span>
          Transfers <span class="tr-count" id="transfers-count"></span>
        </p>
        <div class="transfers" id="transfers"></div>
      </section>

      <section>
        <p class="section-title">Standby teams</p>
        <div class="teams" id="teams"></div>
      </section>

      <section>
        <p class="section-title">Notes</p>
        <textarea id="notes" placeholder="Notes for yourself…"></textarea>
      </section>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script>
      (function () {
        "use strict";
        const LS_LOC = "fieldmanager.locations.v1";
        const LS_TRANSFERS = "fieldmanager.transfers.v1";
        const LS_TR_OPEN = "fieldmanager.transfersOpen.v1";
        const LS_TEAMS = "fieldmanager.teams.v1";
        const LS_THEME = "fieldmanager.theme.v1";
        const LS_NOTES = "fieldmanager.notes.v1";
        const LS_AREA = "fieldmanager.myArea.v1";
        const LS_AREAS = "fieldmanager.areas.v1";
        const LS_VIEW = "fieldmanager.view.v1";
        const LS_SORT = "fieldmanager.sort.v1";
        const LS_FILTER = "fieldmanager.filter.v1";
        const DEFAULT_AREA = "My area";

        let locations = load(LS_LOC, []);
        let transfers = load(LS_TRANSFERS, []);
        let teams = load(LS_TEAMS, []);
        let nextId = 1; // next location id
        let sid = 1; // next shift id
        let tid = 1; // next transfer id
        let teamId = 1; // next standby team id
        let transfersExpanded = localStorage.getItem(LS_TR_OPEN) !== "0";
        // The area being managed. Locations in any other area are still valid
        // transfer endpoints, but they are never listed or counted here.
        let myArea = localStorage.getItem(LS_AREA) || "";
        // Kept explicitly rather than read back off the locations, so an area
        // you have not filled in yet survives switching away from it.
        let areas = load(LS_AREAS, []);

        // "now" counts only the shifts running at this minute; "day" is the
        // whole roster. Now is the default: it is the number you act on.
        let view = localStorage.getItem(LS_VIEW) === "day" ? "day" : "now";
        let sortMode = localStorage.getItem(LS_SORT) || "manual";
        let filterMode = localStorage.getItem(LS_FILTER) || "all";
        // Deliberately not persisted — a search left over from last night's
        // shift hiding half the bars is the last thing you want on open.
        let query = "";
        // Minutes since local midnight. Refreshed on a timer so the Now view
        // keeps up with the clock without rebuilding the list.
        let nowM = nowMinutes();

        migrate();

        const $locations = document.getElementById("locations");
        const $summary = document.getElementById("summary");
        const $newName = document.getElementById("new-name");
        const $addBtn = document.getElementById("add-btn");
        const $moveBtn = document.getElementById("move-btn");
        const $transfersSection = document.getElementById("transfers-section");
        const $transfersToggle = document.getElementById("transfers-toggle");
        const $transfersChevron = document.getElementById("transfers-chevron");
        const $transfersCount = document.getElementById("transfers-count");
        const $transfers = document.getElementById("transfers");
        const $teams = document.getElementById("teams");
        const $notes = document.getElementById("notes");
        const $themeBtn = document.getElementById("theme-btn");
        const $areaSelect = document.getElementById("area-select");
        const $viewSeg = document.getElementById("view-seg");
        const $filterSeg = document.getElementById("filter-seg");
        const $sortSelect = document.getElementById("sort-select");
        const $search = document.getElementById("search");
        const $copyBtn = document.getElementById("copy-btn");
        const $listMeta = document.getElementById("list-meta");
        const $toasts = document.getElementById("toasts");

        let refs = { locs: {}, shifts: {}, rows: {} };

        function load(key, fallback) {
          try {
            return JSON.parse(localStorage.getItem(key)) ?? fallback;
          } catch (e) {
            return fallback;
          }
        }
        function saveLocations() {
          localStorage.setItem(LS_LOC, JSON.stringify(locations));
        }
        function saveTransfers() {
          localStorage.setItem(LS_TRANSFERS, JSON.stringify(transfers));
        }
        function saveTeams() {
          localStorage.setItem(LS_TEAMS, JSON.stringify(teams));
        }
        function saveArea() {
          localStorage.setItem(LS_AREA, myArea);
        }
        function saveAreas() {
          localStorage.setItem(LS_AREAS, JSON.stringify(areas));
        }
        // Deleting a location touches all three stores, and so does undoing it.
        function saveAll() {
          saveLocations();
          saveTransfers();
          saveTeams();
        }

        // Bring older/loose data into the current shape.
        function migrate() {
          if (!Array.isArray(locations)) locations = [];
          if (!Array.isArray(transfers)) transfers = [];
          let maxLoc = 0,
            maxShift = 0,
            maxTr = 0;
          for (const loc of locations) {
            if (typeof loc.id !== "number") loc.id = maxLoc + 1;
            maxLoc = Math.max(maxLoc, loc.id);
            if (typeof loc.expanded !== "boolean") loc.expanded = false;
            if (typeof loc.manager !== "string") loc.manager = "";
            if (typeof loc.area !== "string" || !loc.area.trim())
              loc.area = DEFAULT_AREA;
            // Ad-hoc records for another area's locations, kept only as long
            // as something still points at them. See pruneForeign().
            if (typeof loc.foreign !== "boolean") loc.foreign = false;
            delete loc.note;
            if (!Array.isArray(loc.shifts)) {
              const p = loc.planned || 0,
                a = loc.actual || 0;
              loc.shifts =
                p || a
                  ? [{ id: 0, start: "", end: "", planned: p, actual: a }]
                  : [];
            }
            delete loc.planned;
            delete loc.actual;
            for (const s of loc.shifts)
              maxShift = Math.max(maxShift, s.id || 0);
          }
          for (const t of transfers) {
            maxTr = Math.max(maxTr, t.id || 0);
            // Moves recorded before the log kept times stay untimed rather
            // than being stamped with a time they did not happen at.
            if (typeof t.at !== "number") delete t.at;
          }
          nextId = maxLoc + 1;
          sid = maxShift + 1;
          tid = maxTr + 1;
          for (const loc of locations)
            for (const s of loc.shifts) if (!s.id) s.id = sid++;
          // Drop transfers that reference a location that no longer exists.
          const ids = new Set(locations.map((l) => l.id));
          transfers = transfers.filter((t) => ids.has(t.from) && ids.has(t.to));

          // Standby teams.
          if (!Array.isArray(teams)) teams = [];
          let maxTeam = 0;
          for (const tm of teams) {
            if (typeof tm.id !== "number") tm.id = maxTeam + 1;
            maxTeam = Math.max(maxTeam, tm.id);
            tm.size = Math.max(0, parseInt(tm.size, 10) || 0);
            // location is a location id, or null for the standby pool.
            if (tm.location != null && !ids.has(tm.location))
              tm.location = null;
          }
          teamId = maxTeam + 1;

          // First run, or a save from before areas existed: adopt the area of
          // the first location we did not import from elsewhere.
          if (!myArea) {
            const own = locations.find((l) => !l.foreign);
            myArea = own ? own.area : DEFAULT_AREA;
            saveArea();
          }

          // Any area a location claims is real whether or not it was stored,
          // and the area being managed is real even while it is still empty.
          if (!Array.isArray(areas)) areas = [];
          areas = areas.filter(
            (a, i) =>
              typeof a === "string" && a.trim() && areas.indexOf(a) === i,
          );
          for (const l of locations)
            if (!areas.includes(l.area)) areas.push(l.area);
          if (!areas.includes(myArea)) areas.push(myArea);
          saveAreas();
        }

        function locById(id) {
          return locations.find((l) => l.id === id);
        }
        function myLocations() {
          return locations.filter((l) => l.area === myArea);
        }
        function isForeign(loc) {
          return loc.area !== myArea;
        }
        // Every area we know of: ours first, the rest alphabetically.
        function areaList() {
          const rest = areas.filter((a) => a !== myArea);
          rest.sort((a, b) => a.localeCompare(b));
          return [myArea, ...rest];
        }
        function addArea(name) {
          if (areas.includes(name)) return;
          areas.push(name);
          saveAreas();
        }
        // Out-of-area locations carry their area so a transfer row reads
        // unambiguously next to your own names.
        function labelOf(id) {
          const l = locById(id);
          if (!l) return "(removed)";
          return isForeign(l) ? l.area + " · " + l.name : l.name;
        }
        // An ad-hoc record for another area's location exists only to be one
        // end of a transfer. Once nothing points at it, it stops existing.
        function pruneForeign() {
          const before = locations.length;
          locations = locations.filter(
            (l) =>
              !l.foreign ||
              l.area === myArea ||
              l.shifts.length > 0 ||
              teams.some((tm) => tm.location === l.id) ||
              transfers.some((t) => t.from === l.id || t.to === l.id),
          );
          if (locations.length !== before) saveLocations();
        }

        /* ---------- Clock and shift windows ---------- */

        function pad2(n) {
          return (n < 10 ? "0" : "") + n;
        }
        function hhmm(d) {
          return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
        }
        function clock() {
          return hhmm(new Date());
        }
        function nowMinutes() {
          const d = new Date();
          return d.getHours() * 60 + d.getMinutes();
        }
        // "HH:MM" as minutes since midnight, or null if it is not a usable time.
        function parseHM(v) {
          if (typeof v !== "string") return null;
          const m = /^(\d{1,2}):(\d{2})$/.exec(v.trim());
          if (!m) return null;
          const h = +m[1],
            mi = +m[2];
          if (h > 23 || mi > 59) return null;
          return h * 60 + mi;
        }
        function isTimed(s) {
          return parseHM(s.start) !== null && parseHM(s.end) !== null;
        }
        // Festival shifts run past midnight, so an end at or before the start
        // is read as wrapping into the next day.
        function shiftCovers(s, t) {
          const a = parseHM(s.start),
            b = parseHM(s.end);
          if (a === null || b === null) return false;
          return b > a ? t >= a && t < b : t >= a || t < b;
        }
        function minutesUntil(startM, t) {
          return (startM - t + 1440) % 1440;
        }
        function fmtIn(m) {
          if (m < 60) return m + "m";
          const h = Math.floor(m / 60),
            r = m % 60;
          return r ? h + "h" + pad2(r) : h + "h";
        }
        function shiftRange(s) {
          if (isTimed(s)) return s.start + "–" + s.end;
          return "untimed";
        }

        // What a location looks like at minute `t`: the shifts running, what
        // they call for, and what is coming next. Shifts with no times cannot
        // be placed on a clock at all, so such a location reports its whole
        // roster as current rather than claiming to be closed.
        function nowState(loc, t) {
          const timed = loc.shifts.filter(isTimed);
          if (timed.length === 0) {
            const day = shiftTotals(loc);
            return {
              untimed: true,
              active: [],
              planned: day.planned,
              rostered: day.actual,
              next: null,
              nextIn: null,
            };
          }
          const active = timed.filter((s) => shiftCovers(s, t));
          let planned = 0,
            rostered = 0;
          for (const s of active) {
            planned += s.planned;
            rostered += s.actual;
          }
          // Soonest shift that is not already running.
          let next = null,
            nextIn = null;
          for (const s of timed) {
            if (active.indexOf(s) !== -1) continue;
            const d = minutesUntil(parseHM(s.start), t);
            if (nextIn === null || d < nextIn) {
              nextIn = d;
              next = s;
            }
          }
          return { untimed: false, active, planned, rostered, next, nextIn };
        }

        /* ---------- Headcounts ---------- */

        function shiftTotals(loc) {
          return loc.shifts.reduce(
            (a, s) => ({
              planned: a.planned + s.planned,
              actual: a.actual + s.actual,
            }),
            { planned: 0, actual: 0 },
          );
        }

        // Standby team members assigned to a given location.
        function standbyForLocation(locId) {
          return teams.reduce(
            (n, tm) => n + (tm.location === locId ? tm.size : 0),
            0,
          );
        }
        // Unassigned reserve (teams sitting on 'Standby').
        function reservePool() {
          return teams.reduce(
            (n, tm) => n + (tm.location == null ? tm.size : 0),
            0,
          );
        }

        // People borrowed in (positive) minus people loaned out (negative).
        function netTransfer(locId) {
          let n = 0;
          for (const t of transfers) {
            if (t.to === locId) n += t.count;
            if (t.from === locId) n -= t.count;
          }
          return n;
        }

        // Planned and actual under the current view. Transfers and standby
        // teams are point-in-time adjustments, so they only fold into the Now
        // figure; the day column stays a plain roster sum, which is the only
        // way the two numbers mean the same kind of thing as each other.
        function viewTotals(loc) {
          if (view !== "now") {
            const day = shiftTotals(loc);
            return { planned: day.planned, actual: day.actual, st: null };
          }
          const st = nowState(loc, nowM);
          return {
            planned: st.planned,
            actual:
              st.rostered + netTransfer(loc.id) + standbyForLocation(loc.id),
            st: st,
          };
        }
        function viewDiff(loc) {
          const t = viewTotals(loc);
          return t.actual - t.planned;
        }

        // Headcount actually standing at a location this minute: the shifts
        // running now, plus transfers in and out, plus any standby team parked
        // there. This is the number a move has to respect, whichever view the
        // list happens to be in.
        function onSiteNow(loc) {
          return (
            nowState(loc, nowMinutes()).rostered +
            netTransfer(loc.id) +
            standbyForLocation(loc.id)
          );
        }

        function diffInfo(planned, actual) {
          const d = actual - planned;
          if (d < 0) return { cls: "under", label: String(d) };
          if (d > 0) return { cls: "over", label: "+" + d };
          return { cls: "matched", label: "0" };
        }

        function setDiff(el, planned, actual) {
          const info = diffInfo(planned, actual);
          const isCol = el.classList.contains("col-diff");
          el.className = "diff " + info.cls + (isCol ? " col-diff" : "");
          el.textContent = info.label;
        }

        function signed(n) {
          return n > 0 ? "+" + n : String(n);
        }
        function plural(n, one, many) {
          return n + " " + (n === 1 ? one : many);
        }

        /* ---------- Toasts ---------- */

        // Short-lived message at the bottom of the screen, optionally carrying
        // one action. Deletions use it to offer an undo rather than asking for
        // confirmation up front, which is both faster and safer on a phone.
        const MAX_TOASTS = 3;
        function toast(message, opts) {
          const o = opts || {};
          const el = document.createElement("div");
          el.className = "toast";
          const msg = document.createElement("span");
          msg.className = "toast-msg";
          msg.textContent = message;
          el.appendChild(msg);

          let timer = null;
          function dismiss() {
            if (timer) clearTimeout(timer);
            timer = null;
            el.classList.add("out");
            setTimeout(() => el.remove(), 220);
          }

          if (o.action) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "toast-btn";
            b.textContent = o.label || "Undo";
            b.addEventListener("click", () => {
              dismiss();
              o.action();
            });
            el.appendChild(b);
          }

          $toasts.appendChild(el);
          while ($toasts.children.length > MAX_TOASTS)
            $toasts.firstChild.remove();

          const ms = o.ms || (o.action ? 8000 : 2600);
          if (ms !== Infinity) timer = setTimeout(dismiss, ms);
        }

        /* ---------- Modals ---------- */

        // The move dialog opens a small form on top of itself, so key handling
        // has to know which layer is in front. Each modal takes a token on open
        // and ignores Escape/Enter unless it is the one on top.
        const modalStack = [];
        let modalSeq = 0;
        function pushModal() {
          const token = ++modalSeq;
          modalStack.push(token);
          return token;
        }
        function popModal(token) {
          const i = modalStack.indexOf(token);
          if (i !== -1) modalStack.splice(i, 1);
        }
        function isTopModal(token) {
          return modalStack[modalStack.length - 1] === token;
        }

        function confirmModal({ title, message, confirmLabel = "Delete" }) {
          return new Promise((resolve) => {
            const token = pushModal();
            const prevFocus = document.activeElement;
            const overlay = document.createElement("div");
            overlay.className = "modal-overlay";

            const modal = document.createElement("div");
            modal.className = "modal";
            modal.setAttribute("role", "dialog");
            modal.setAttribute("aria-modal", "true");

            const h = document.createElement("h2");
            h.textContent = title;
            const p = document.createElement("p");
            p.textContent = message;

            const actions = document.createElement("div");
            actions.className = "modal-actions";
            const cancel = document.createElement("button");
            cancel.className = "btn-ghost";
            cancel.textContent = "Cancel";
            const confirm = document.createElement("button");
            confirm.className = "btn-danger";
            confirm.textContent = confirmLabel;
            actions.appendChild(cancel);
            actions.appendChild(confirm);

            modal.appendChild(h);
            modal.appendChild(p);
            modal.appendChild(actions);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            cancel.focus();

            function close(result) {
              popModal(token);
              document.removeEventListener("keydown", onKey);
              overlay.remove();
              if (prevFocus && prevFocus.focus) prevFocus.focus();
              resolve(result);
            }
            // Escape only. Enter is left to whichever button has focus — which
            // is Cancel — so a stray keypress can never confirm a deletion.
            function onKey(e) {
              if (!isTopModal(token)) return;
              if (e.key === "Escape") close(false);
            }
            cancel.addEventListener("click", () => close(false));
            confirm.addEventListener("click", () => close(true));
            overlay.addEventListener("click", (e) => {
              if (e.target === overlay) close(false);
            });
            document.addEventListener("keydown", onKey);
          });
        }

        /* ---------- Render locations ---------- */

        function render() {
          pruneForeign();
          renderAreaSwitch();
          paintToolbar();
          nowM = nowMinutes();
          $locations.innerHTML = "";
          refs = { locs: {}, shifts: {}, rows: {} };

          const mine = myLocations();
          const shown = visibleLocations(mine);
          if (mine.length === 0) {
            const e = document.createElement("div");
            e.className = "empty";
            e.textContent = locations.length
              ? "No locations in " + myArea + " yet. Add one above."
              : "No locations yet. Add one above to get started.";
            $locations.appendChild(e);
          } else if (shown.length === 0) {
            const e = document.createElement("div");
            e.className = "empty";
            e.textContent = "No locations match the current search or filter.";
            $locations.appendChild(e);
          } else {
            for (const loc of shown) $locations.appendChild(renderLoc(loc));
          }

          renderListMeta(mine.length, shown.length);
          refreshComputed();
          renderTransfers();
          renderTeams();
        }

        /* ---------- Search, filter, sort ---------- */

        // The list you actually see: your area, narrowed by the search box and
        // the All/Short/OK filter, in the chosen order. Short and Most-short
        // both read the diff of the current view, so switching to Now retriages
        // the list against what is standing there this minute.
        function visibleLocations(mine) {
          const q = query.trim().toLowerCase();
          const out = mine.filter((loc) => {
            if (q && !(loc.name + " " + loc.manager).toLowerCase().includes(q))
              return false;
            if (filterMode === "short") return viewDiff(loc) < 0;
            if (filterMode === "ok") return viewDiff(loc) >= 0;
            return true;
          });
          if (sortMode === "name") {
            out.sort((a, b) => a.name.localeCompare(b.name));
          } else if (sortMode === "worst") {
            out.sort(
              (a, b) =>
                viewDiff(a) - viewDiff(b) || a.name.localeCompare(b.name),
            );
          }
          return out;
        }

        function paintToolbar() {
          for (const b of $viewSeg.querySelectorAll(".seg-btn"))
            b.setAttribute(
              "aria-pressed",
              b.dataset.view === view ? "true" : "false",
            );
          for (const b of $filterSeg.querySelectorAll(".seg-btn"))
            b.setAttribute(
              "aria-pressed",
              b.dataset.filter === filterMode ? "true" : "false",
            );
          $sortSelect.value = sortMode;
        }

        function renderListMeta(total, shown) {
          if (shown === total) {
            $listMeta.style.display = "none";
            $listMeta.innerHTML = "";
            return;
          }
          $listMeta.style.display = "";
          $listMeta.innerHTML = "";
          const txt = document.createElement("span");
          txt.textContent = "Showing " + shown + " of " + total;
          const clear = document.createElement("button");
          clear.type = "button";
          clear.textContent = "Clear";
          clear.addEventListener("click", () => {
            query = "";
            $search.value = "";
            filterMode = "all";
            localStorage.setItem(LS_FILTER, filterMode);
            render();
          });
          $listMeta.appendChild(txt);
          $listMeta.appendChild(clear);
        }

        $viewSeg.addEventListener("click", (e) => {
          const b = e.target.closest(".seg-btn");
          if (!b) return;
          view = b.dataset.view === "day" ? "day" : "now";
          localStorage.setItem(LS_VIEW, view);
          render();
        });

        $filterSeg.addEventListener("click", (e) => {
          const b = e.target.closest(".seg-btn");
          if (!b) return;
          filterMode = b.dataset.filter;
          localStorage.setItem(LS_FILTER, filterMode);
          render();
        });

        $sortSelect.addEventListener("change", () => {
          sortMode = $sortSelect.value;
          localStorage.setItem(LS_SORT, sortMode);
          render();
        });

        $search.addEventListener("input", () => {
          query = $search.value;
          render();
        });

        // The Now view is only as good as its clock. Figures and chips are
        // refreshed in place; the order is deliberately left alone, so rows
        // never shuffle under a thumb that is mid-tap.
        setInterval(() => {
          if (view === "now") refreshComputed();
        }, 15000);

        /* ---------- Area switcher ---------- */

        const NEW_AREA = "␀new-area";
        const REMOVE_AREA = "␀remove-area";

        function renderAreaSwitch() {
          $areaSelect.innerHTML = "";
          for (const a of areaList()) {
            const o = document.createElement("option");
            o.value = a;
            o.textContent = a;
            $areaSelect.appendChild(o);
          }
          const add = document.createElement("option");
          add.value = NEW_AREA;
          add.textContent = "+ New area…";
          $areaSelect.appendChild(add);
          // Areas stay until dropped, so there has to be a way out. Offered
          // only with nothing to lose here and somewhere else to land.
          if (myLocations().length === 0 && areas.length > 1) {
            const rm = document.createElement("option");
            rm.value = REMOVE_AREA;
            rm.textContent = "− Remove “" + myArea + "”";
            $areaSelect.appendChild(rm);
          }
          $areaSelect.value = myArea;
        }

        $areaSelect.addEventListener("change", async () => {
          const picked = $areaSelect.value;
          if (picked === REMOVE_AREA) {
            // Nothing is being deleted but the name itself, so no confirmation.
            const next = areaList()[1];
            areas = areas.filter((a) => a !== myArea);
            saveAreas();
            myArea = next;
            saveArea();
            render();
            return;
          }
          if (picked !== NEW_AREA) {
            switchArea(picked);
            return;
          }
          // Put the select back before awaiting, so a cancelled prompt does
          // not leave "+ New area…" showing as the current area.
          $areaSelect.value = myArea;
          const values = await formModal({
            title: "New area",
            fields: [{ label: "Area name", placeholder: "e.g. Area B" }],
            confirmLabel: "Create",
          });
          const name = values && values[0].trim();
          if (name) switchArea(name);
        });

        function switchArea(name) {
          addArea(name);
          if (name === myArea) {
            renderAreaSwitch();
            return;
          }
          myArea = name;
          saveArea();
          render();
        }

        function renderLoc(loc) {
          const card = document.createElement("div");
          card.className = "loc";

          const head = document.createElement("div");
          head.className = "loc-head";

          const exp = document.createElement("button");
          exp.className = "exp";
          exp.textContent = loc.expanded ? "▾" : "▸";
          exp.title = loc.expanded ? "Collapse" : "Expand";

          const title = document.createElement("div");
          title.className = "loc-title";
          const titleMain = document.createElement("div");
          titleMain.className = "loc-title-main";
          const name = document.createElement("span");
          name.className = "loc-name";
          name.textContent = loc.name;
          name.title = loc.name;
          const manager = document.createElement("span");
          manager.className = "loc-manager";
          if (loc.manager.trim()) {
            manager.textContent = loc.manager;
            manager.title = "Bar manager: " + loc.manager;
          } else {
            manager.style.display = "none";
          }
          // In the Now view this reads as the running shift window, or
          // "closed"; in the All day view it stays a shift count.
          const count = document.createElement("span");
          count.className = "shift-count";
          const nextChip = document.createElement("span");
          nextChip.className = "next-chip";
          nextChip.style.display = "none";
          const loan = document.createElement("span");
          loan.className = "loan";
          loan.style.display = "none";
          const standbyChip = document.createElement("span");
          standbyChip.className = "standby-chip";
          standbyChip.style.display = "none";
          titleMain.appendChild(name);
          titleMain.appendChild(manager);
          titleMain.appendChild(count);
          titleMain.appendChild(nextChip);
          titleMain.appendChild(loan);
          titleMain.appendChild(standbyChip);
          title.appendChild(titleMain);

          const toggle = () => {
            loc.expanded = !loc.expanded;
            saveLocations();
            render();
          };
          exp.addEventListener("click", toggle);
          title.addEventListener("click", toggle);

          const plannedField = statField("Planned");
          const actualField = statField("Actual");

          const diffWrap = document.createElement("div");
          diffWrap.className = "field";
          const diffLabel = document.createElement("label");
          diffLabel.textContent = "Diff";
          const diffVal = document.createElement("div");
          diffVal.className = "diff";
          diffWrap.appendChild(diffLabel);
          diffWrap.appendChild(diffVal);

          const editBtn = document.createElement("button");
          editBtn.className = "btn-edit";
          editBtn.innerHTML = "&#9998;";
          editBtn.title = "Edit name & manager";
          editBtn.setAttribute("aria-label", "Edit " + loc.name);
          editBtn.addEventListener("click", () => editLocationModal(loc));

          const dupBtn = document.createElement("button");
          dupBtn.className = "btn-dup";
          dupBtn.innerHTML = "&#10697;";
          dupBtn.title = "Duplicate with its shifts";
          dupBtn.setAttribute("aria-label", "Duplicate " + loc.name);
          dupBtn.addEventListener("click", () => duplicateLocation(loc));

          const del = document.createElement("button");
          del.className = "btn-del";
          del.innerHTML = "&times;";
          del.title = "Remove location";
          del.setAttribute("aria-label", "Remove " + loc.name);
          del.addEventListener("click", async () => {
            const n = loc.shifts.length;
            const shiftsNote = n
              ? " and its " + plural(n, "shift", "shifts")
              : "";
            const ok = await confirmModal({
              title: "Delete location?",
              message:
                "“" +
                (loc.name.trim() || "This location") +
                "”" +
                shiftsNote +
                " will be removed.",
            });
            if (!ok) return;
            // Enough to put every piece back: where it sat, the transfers that
            // went with it, and which teams were standing there.
            const idx = locations.indexOf(loc);
            const cutTransfers = transfers.filter(
              (t) => t.from === loc.id || t.to === loc.id,
            );
            const detached = teams
              .filter((tm) => tm.location === loc.id)
              .map((tm) => tm.id);
            locations = locations.filter((l) => l.id !== loc.id);
            transfers = transfers.filter(
              (t) => t.from !== loc.id && t.to !== loc.id,
            );
            // Any standby teams here fall back to the reserve pool.
            for (const tm of teams)
              if (tm.location === loc.id) tm.location = null;
            saveAll();
            render();
            toast("Deleted “" + (loc.name.trim() || "location") + "”", {
              action: () => {
                locations.splice(Math.min(idx, locations.length), 0, loc);
                for (const t of cutTransfers)
                  if (!transfers.some((x) => x.id === t.id)) transfers.push(t);
                for (const id of detached) {
                  const tm = teams.find((x) => x.id === id);
                  if (tm && tm.location == null) tm.location = loc.id;
                }
                saveAll();
                render();
              },
            });
          });

          // Stats and actions are grouped so the narrow layout can move them
          // around as blocks; on wide screens both wrappers are
          // `display: contents`, so the head stays one flat flex row.
          const stats = document.createElement("div");
          stats.className = "loc-stats";
          stats.appendChild(plannedField.wrap);
          stats.appendChild(actualField.wrap);
          stats.appendChild(diffWrap);

          const actions = document.createElement("div");
          actions.className = "loc-actions";
          actions.appendChild(editBtn);
          actions.appendChild(dupBtn);
          actions.appendChild(del);

          head.appendChild(exp);
          head.appendChild(title);
          head.appendChild(stats);
          head.appendChild(actions);
          card.appendChild(head);

          refs.locs[loc.id] = {
            planned: plannedField.val,
            actual: actualField.val,
            diff: diffVal,
            count: count,
            next: nextChip,
            loan: loan,
            standbyChip: standbyChip,
            name: name,
            manager: manager,
          };

          if (loc.expanded) card.appendChild(renderShifts(loc));
          return card;
        }

        function statField(labelText) {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const label = document.createElement("label");
          label.textContent = labelText;
          const val = document.createElement("span");
          val.className = "val";
          val.textContent = "0";
          wrap.appendChild(label);
          wrap.appendChild(val);
          return { wrap, val };
        }

        function modalField(labelText, value, placeholder) {
          const field = document.createElement("div");
          field.className = "loc-field";
          const label = document.createElement("label");
          label.textContent = labelText;
          const input = document.createElement("input");
          input.type = "text";
          input.value = value || "";
          input.placeholder = placeholder;
          field.appendChild(label);
          field.appendChild(input);
          return { field, input };
        }

        // A modal of text fields. Resolves to their values in order, or to
        // null if dismissed. Optional `list` on a field offers suggestions.
        let listSeq = 0;
        function formModal({ title, fields, confirmLabel = "Save" }) {
          return new Promise((resolve) => {
            const token = pushModal();
            const prevFocus = document.activeElement;
            const overlay = document.createElement("div");
            overlay.className = "modal-overlay";
            const modal = document.createElement("div");
            modal.className = "modal";
            modal.setAttribute("role", "dialog");
            modal.setAttribute("aria-modal", "true");

            const h = document.createElement("h2");
            h.textContent = title;

            const wrap = document.createElement("div");
            wrap.className = "modal-fields";
            const inputs = fields.map((f) => {
              const built = modalField(f.label, f.value, f.placeholder);
              if (f.list && f.list.length) {
                const dl = document.createElement("datalist");
                dl.id = "fm-list-" + ++listSeq;
                for (const v of f.list) {
                  const o = document.createElement("option");
                  o.value = v;
                  dl.appendChild(o);
                }
                built.field.appendChild(dl);
                built.input.setAttribute("list", dl.id);
              }
              wrap.appendChild(built.field);
              return built.input;
            });

            const actions = document.createElement("div");
            actions.className = "modal-actions";
            const cancel = document.createElement("button");
            cancel.className = "btn-ghost";
            cancel.textContent = "Cancel";
            const save = document.createElement("button");
            save.className = "btn-confirm";
            save.textContent = confirmLabel;
            actions.appendChild(cancel);
            actions.appendChild(save);

            modal.appendChild(h);
            modal.appendChild(wrap);
            modal.appendChild(actions);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            inputs[0].focus();
            inputs[0].select();

            function close(result) {
              popModal(token);
              document.removeEventListener("keydown", onKey);
              overlay.remove();
              if (prevFocus && prevFocus.focus) prevFocus.focus();
              resolve(result);
            }
            function commit() {
              close(inputs.map((i) => i.value));
            }
            function onKey(e) {
              if (!isTopModal(token)) return;
              if (e.key === "Escape") close(null);
              else if (e.key === "Enter") commit();
            }
            cancel.addEventListener("click", () => close(null));
            save.addEventListener("click", commit);
            overlay.addEventListener("click", (e) => {
              if (e.target === overlay) close(null);
            });
            document.addEventListener("keydown", onKey);
          });
        }

        // Last resort when the clipboard is unavailable: put the text on screen,
        // selected, so it can be copied by hand.
        function textModal(title, text) {
          const token = pushModal();
          const prevFocus = document.activeElement;
          const overlay = document.createElement("div");
          overlay.className = "modal-overlay";
          const modal = document.createElement("div");
          modal.className = "modal";
          modal.setAttribute("role", "dialog");
          modal.setAttribute("aria-modal", "true");

          const h = document.createElement("h2");
          h.textContent = title;
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.readOnly = true;
          ta.rows = 12;
          ta.style.width = "100%";
