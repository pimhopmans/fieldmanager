<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Manager</title>
    <script>
      /* Apply saved theme before first paint to avoid a flash. */
      (function () {
        try {
          var t = localStorage.getItem("fieldmanager.theme.v1");
          if (t === "light" || t === "dark")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --card: #ffffff;
        --border: #e3e6ea;
        --text: #1c1f23;
        --muted: #6b7280;
        --accent: #2563eb;
        --ok: #16a34a;
        --under: #dc2626;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #16181c;
          --card: #1f2227;
          --border: #2c3036;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --accent: #3b82f6;
          --ok: #22c55e;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #16181c;
        --card: #1f2227;
        --border: #2c3036;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #3b82f6;
        --ok: #22c55e;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 780px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .theme-btn {
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        width: 36px;
        height: 36px;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .theme-btn:hover {
        border-color: var(--accent);
      }
      h1 {
        font-size: 22px;
        font-weight: 650;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .summary {
        font-size: 13px;
        color: var(--muted);
      }
      .summary b {
        color: var(--text);
        font-weight: 600;
      }
      section {
        margin-top: 28px;
      }
      .section-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 12px 2px;
      }
      .tr-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .tr-chevron {
        font-size: 10px;
        color: var(--muted);
      }
      .tr-count {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }
      /* Add / toolbar */
      .add-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .add-row input[type="text"] {
        flex: 1;
      }
      input[type="text"],
      input[type="number"],
      input[type="time"],
      select {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 11px;
        outline: none;
        transition: border-color 0.12s;
      }
      input:focus,
      select:focus {
        border-color: var(--accent);
      }
      input[type="number"] {
        width: 62px;
        text-align: center;
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        transition:
          background 0.12s,
          opacity 0.12s,
          border-color 0.12s,
          color 0.12s;
      }
      .btn-add {
        background: var(--accent);
        color: #fff;
        font-weight: 550;
        padding: 9px 18px;
        white-space: nowrap;
      }
      .btn-add:hover {
        opacity: 0.9;
      }
      .btn-move {
        background: var(--card);
        color: var(--text);
        font-weight: 550;
        padding: 9px 16px;
        border: 1px solid var(--border);
        white-space: nowrap;
      }
      .btn-move:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-move.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* Move modal */
      .move-cols {
        display: flex;
        align-items: stretch;
        gap: 12px;
      }
      .move-col {
        flex: 1 1 0;
        min-width: 0;
      }
      /* Sits between the two columns, pointing from source to destination. */
      .move-cols .arrow {
        align-self: center;
        color: var(--muted);
        font-size: 16px;
        padding-top: 14px;
      }
      .picker {
        margin-top: 4px;
        max-height: 216px;
        overflow-y: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .picker-option {
        width: 100%;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 11px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        color: var(--text);
        font: inherit;
        font-weight: 500;
        text-align: left;
      }
      .picker-option:last-child {
        border-bottom: 0;
      }
      .picker-option:hover {
        background: var(--card);
      }
      .picker-option:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      /* Listed after :hover, and matching it on specificity, so a hovered
         selection keeps its accent fill instead of going white-on-white. */
      .picker-option[aria-pressed="true"],
      .picker-option[aria-pressed="true"]:hover {
        background: var(--accent);
        color: #fff;
      }
      .picker-option .nm {
        overflow-wrap: anywhere;
        line-height: 1.35;
      }
      .picker-option .staff {
        flex: none;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .picker-option[aria-pressed="true"] .staff {
        color: rgba(255, 255, 255, 0.8);
      }
      .picker-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .move-count {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
      }
      .move-count label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .move-count input {
        background: var(--bg);
      }
      .move-summary {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        color: var(--muted);
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .btn-confirm {
        background: var(--accent);
        color: #fff;
        font-weight: 550;
        padding: 9px 16px;
      }
      .btn-confirm:hover {
        opacity: 0.9;
      }
      /* Location cards */
      .locations {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .loc {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .loc-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
      }
      /* Grouping wrappers exist only so the narrow layout can position them;
         on wide screens they dissolve into the surrounding flex row. */
      .loc-stats,
      .loc-actions,
      .cell {
        display: contents;
      }
      .cell-label {
        display: none;
      }
      .exp {
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex: none;
      }
      .loc-title {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        cursor: pointer;
      }
      .loc-title-main {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 100%;
        min-width: 0;
      }
      .loc-name {
        font-weight: 550;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        /* Yields before the manager's name, but never all the way to nothing. */
        flex: 0 4 auto;
        min-width: 5em;
      }
      .shift-count {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        flex: none;
      }
      .loan {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        flex: none;
        white-space: nowrap;
      }
      .loan.in {
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 14%, transparent);
      }
      .loan.out {
        color: var(--under);
        background: color-mix(in srgb, var(--under) 14%, transparent);
      }
      .field {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        flex: none;
      }
      .field label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .field .val {
        font-weight: 600;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .diff {
        min-width: 54px;
        text-align: center;
        font-weight: 700;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        padding: 6px 8px;
        border-radius: 8px;
      }
      .diff.matched {
        color: var(--text);
        background: color-mix(in srgb, var(--muted) 16%, transparent);
      }
      .diff.under {
        color: var(--under);
        background: color-mix(in srgb, var(--under) 12%, transparent);
      }
      .diff.over {
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 12%, transparent);
      }
      .btn-del {
        background: transparent;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        padding: 6px 8px;
        border-radius: 6px;
        flex: none;
      }
      .btn-del:hover {
        color: var(--under);
        background: color-mix(in srgb, var(--under) 12%, transparent);
      }
      .btn-edit {
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        padding: 6px 8px;
        border-radius: 6px;
        flex: none;
      }
      .btn-edit:hover,
      .btn-edit.active {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      /* Shifts panel */
      .shifts {
        padding: 4px 16px 16px 50px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid var(--border);
        margin-top: 2px;
      }
      .shifts-head,
      .shift {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .shifts-head {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
        padding-top: 10px;
      }
      .col-times {
        width: 200px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .col-times input[type="time"] {
        flex: 1;
        min-width: 0;
        padding: 8px 6px;
      }
      .dash {
        color: var(--muted);
        flex: none;
      }
      .col-num {
        width: 62px;
        flex: none;
        text-align: center;
      }
      input[type="number"].col-num {
        width: 62px;
      }
      .col-diff {
        width: 56px;
        flex: none;
        min-width: 0;
      }
      .shifts-head .col-diff {
        text-align: center;
      }
      .col-del {
        width: 34px;
        flex: none;
      }
      .btn-shift {
        align-self: flex-start;
        background: transparent;
        color: var(--accent);
        font-weight: 550;
        padding: 7px 12px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        font-size: 13px;
        margin-top: 2px;
      }
      .btn-shift:hover {
        border-color: var(--accent);
      }
      .no-shifts {
        font-size: 13px;
        color: var(--muted);
        padding: 8px 0 2px;
      }
      .loc-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .loc-field label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .loc-field input {
        width: 100%;
        background: var(--bg);
      }
      .loc-manager {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        flex: 0 1 auto;
        min-width: 2.5em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .standby-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        flex: none;
        white-space: nowrap;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .loc-standby {
        padding-top: 8px;
        margin-top: 4px;
        border-top: 1px solid var(--border);
      }
      .loc-standby-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 4px;
      }
      .loc-standby-item {
        font-size: 13px;
        color: var(--text);
      }
      /* Standby teams section */
      .teams {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .team {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        box-shadow: var(--shadow);
      }
      .team .mini {
        font-size: 13px;
        color: var(--muted);
      }
      .team .arrow {
        color: var(--muted);
      }
      .team select {
        flex: 1;
        min-width: 0;
        background: var(--bg);
      }
      .teams-empty {
        font-size: 13px;
        color: var(--muted);
        padding: 2px 0 4px;
      }
      .btn-team {
        align-self: flex-start;
        background: transparent;
        color: var(--accent);
        font-weight: 550;
        padding: 8px 12px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        font-size: 13px;
      }
      .btn-team:hover {
        border-color: var(--accent);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        padding: 28px 0;
        border: 1px dashed var(--border);
        border-radius: 12px;
      }
      /* Transfers list */
      .transfers {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .transfer {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        box-shadow: var(--shadow);
      }
      .transfer .route {
        flex: 1;
        font-size: 14px;
        min-width: 0;
      }
      .transfer .route b {
        font-weight: 600;
      }
      .transfer .route .via {
        color: var(--muted);
        margin: 0 6px;
      }
      .transfer .cnt {
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .transfer .cnt b {
        color: var(--text);
        font-weight: 600;
      }
      /* Notes */
      textarea {
        width: 100%;
        min-height: 160px;
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        outline: none;
        resize: vertical;
        box-shadow: var(--shadow);
        transition: border-color 0.12s;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        justify-content: center;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 20px;
        z-index: 100;
        animation: modal-fade 0.12s ease-out;
      }
      .modal-overlay > * {
        margin: auto;
      }
      .modal {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 12px 44px rgba(0, 0, 0, 0.3);
        max-width: 380px;
        width: 100%;
        padding: 22px 22px 18px;
        animation: modal-pop 0.13s ease-out;
      }
      .modal-wide {
        max-width: 600px;
      }
      .modal h2 {
        font-size: 17px;
        font-weight: 650;
        margin: 0 0 8px;
      }
      .modal p {
        font-size: 14px;
        color: var(--muted);
        margin: 0 0 20px;
        line-height: 1.5;
      }
      .modal-fields {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin: 4px 0 22px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .btn-ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 9px 16px;
        font-weight: 500;
      }
      .btn-ghost:hover {
        border-color: var(--muted);
      }
      .btn-danger {
        background: var(--under);
        color: #fff;
        font-weight: 550;
        padding: 9px 16px;
      }
      .btn-danger:hover {
        opacity: 0.9;
      }
      @keyframes modal-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes modal-pop {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
      }
      /* ---------- Narrow screens ---------- */
      @media (max-width: 760px) {
        .wrap {
          padding: 20px 14px 64px;
        }
        h1 {
          font-size: 20px;
        }
        header {
          gap: 10px;
        }
        .header-right {
          flex: 1 1 100%;
          justify-content: space-between;
          gap: 10px;
        }

        /* Add row: the field takes a full line, the buttons split the next. */
        .add-row {
          flex-wrap: wrap;
        }
        .add-row input[type="text"] {
          flex: 1 1 100%;
        }
        .add-row .btn-add,
        .add-row .btn-move {
          flex: 1 1 0;
          padding: 11px 12px;
        }

        /* Location header: name + actions on top, stats on their own row. */
        .loc-head {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr) auto;
          grid-template-areas:
            "exp   title actions"
            "stats stats stats";
          align-items: start;
          column-gap: 10px;
          row-gap: 0;
          padding: 12px 14px 0;
        }
        /* 20px tall, so the glyph centres on the first line of the name. */
        .exp {
          grid-area: exp;
          width: 24px;
          height: 20px;
          margin-left: -4px;
        }
        .loc-title {
          grid-area: title;
          min-width: 0;
          gap: 2px;
        }
        .loc-title-main {
          flex-wrap: wrap;
          gap: 4px 8px;
        }
        .loc-name {
          white-space: normal;
          overflow: visible;
          overflow-wrap: anywhere;
          line-height: 1.3;
        }
        .loc-manager {
          white-space: normal;
          overflow: visible;
        }
        .loc-actions {
          grid-area: actions;
          display: flex;
          align-items: center;
          gap: 0;
          margin: -4px -6px 0 0;
        }
        .loc-actions .btn-edit,
        .loc-actions .btn-del {
          height: 32px;
          padding: 0 9px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .loc-stats {
          grid-area: stats;
          display: flex;
          align-items: flex-start;
          gap: 6px;
          margin-top: 11px;
          padding: 11px 0 12px;
          border-top: 1px solid var(--border);
        }
        .loc-stats .field {
          flex: 1 1 0;
          min-width: 0;
          gap: 5px;
        }
        .loc-stats .field .val,
        .loc-stats .diff {
          width: 100%;
          min-width: 0;
          max-width: 130px;
          height: 32px;
          padding: 0 6px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        /* Shifts: one card per shift, with the column header inlined as
           per-control labels. */
        .shifts {
          padding: 8px 12px 14px;
          gap: 10px;
        }
        .shifts-head {
          display: none;
        }
        .shift {
          display: grid;
          grid-template-columns:
            minmax(0, 1fr) minmax(0, 1fr)
            minmax(0, 1fr) auto;
          grid-template-areas:
            "times   times  times times"
            "planned actual diff  del";
          align-items: end;
          column-gap: 8px;
          row-gap: 10px;
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 10px;
        }
        .shift .col-times {
          grid-area: times;
          width: auto;
          max-width: 320px;
          gap: 6px;
        }
        .shift .col-times input[type="time"] {
          padding: 9px 4px;
          text-align: center;
        }
        .shift > .btn-del.col-del {
          grid-area: del;
          width: auto;
          height: 40px;
          padding: 0 8px;
          margin-right: -2px;
          align-self: end;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .shift .cell {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 3px;
          min-width: 0;
        }
        .shift .cell-planned {
          grid-area: planned;
        }
        .shift .cell-actual {
          grid-area: actual;
        }
        .shift .cell-diff {
          grid-area: diff;
        }
        .cell-label {
          display: block;
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          color: var(--muted);
          font-weight: 600;
          line-height: 1.4;
        }
        .shift .cell input[type="number"].col-num {
          width: 100%;
          max-width: 130px;
          height: 40px;
          padding: 9px 6px;
        }
        .shift .cell .diff {
          width: 100%;
          min-width: 0;
          max-width: 130px;
          height: 40px;
          padding: 0 4px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .btn-shift {
          padding: 9px 14px;
        }

        /* Move modal: the two pickers stack, so the arrow steps downward. */
        .move-cols {
          flex-direction: column;
          gap: 10px;
        }
        .move-cols .arrow {
          padding-top: 0;
          line-height: 1;
          transform: rotate(90deg);
        }
        .picker {
          max-height: 168px;
        }
        .move-count {
          flex-wrap: wrap;
          margin-top: 14px;
        }
        /* Too little room to sit beside the stepper without truncating. */
        .move-summary {
          flex: 1 1 100%;
          text-align: left;
          white-space: normal;
        }

        /* Standby teams: team size on top, destination on its own full-width
           line below. The arrow that joins the two on one row has nothing left
           to join, so it goes. */
        .team {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr) auto;
          grid-template-areas:
            "size label del"
            "loc  loc   loc";
          align-items: center;
          column-gap: 8px;
          row-gap: 10px;
          padding: 10px 12px;
        }
        .team > input[type="number"] {
          grid-area: size;
        }
        .team > .mini {
          grid-area: label;
        }
        .team > .arrow {
          display: none;
        }
        .team .cell-team-loc {
          grid-area: loc;
          display: flex;
          flex-direction: column;
          gap: 3px;
          min-width: 0;
        }
        .team .cell-team-loc select {
          width: 100%;
        }
        .team > .btn-del {
          grid-area: del;
          height: 34px;
          padding: 0 9px;
          margin-right: -4px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .transfer {
          gap: 8px;
          padding: 10px 12px;
        }
        .modal-overlay {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Field Manager</h1>
        <div class="header-right">
          <div class="summary" id="summary"></div>
          <button
            class="theme-btn"
            id="theme-btn"
            aria-label="Toggle color theme"
          >
            ☀
          </button>
        </div>
      </header>

      <section>
        <p class="section-title">Locations</p>
        <div class="add-row">
          <input
            type="text"
            id="new-name"
            placeholder="Add a location (e.g. Drinks 1, Speciaalbierbar)"
            autocomplete="off"
          />
          <button class="btn-add" id="add-btn">Add</button>
          <button class="btn-move" id="move-btn">Move</button>
        </div>
        <div class="locations" id="locations"></div>
      </section>

      <section id="transfers-section" style="display: none">
        <p class="section-title tr-toggle" id="transfers-toggle">
          <span class="tr-chevron" id="transfers-chevron">▾</span>
          Transfers <span class="tr-count" id="transfers-count"></span>
        </p>
        <div class="transfers" id="transfers"></div>
      </section>

      <section>
        <p class="section-title">Standby teams</p>
        <div class="teams" id="teams"></div>
      </section>

      <section>
        <p class="section-title">Notes</p>
        <textarea id="notes" placeholder="Notes for yourself…"></textarea>
      </section>
    </div>

    <script>
      (function () {
        "use strict";
        const LS_LOC = "fieldmanager.locations.v1";
        const LS_TRANSFERS = "fieldmanager.transfers.v1";
        const LS_TR_OPEN = "fieldmanager.transfersOpen.v1";
        const LS_TEAMS = "fieldmanager.teams.v1";
        const LS_THEME = "fieldmanager.theme.v1";
        const LS_NOTES = "fieldmanager.notes.v1";

        let locations = load(LS_LOC, []);
        let transfers = load(LS_TRANSFERS, []);
        let teams = load(LS_TEAMS, []);
        let nextId = 1; // next location id
        let sid = 1; // next shift id
        let tid = 1; // next transfer id
        let teamId = 1; // next standby team id
        let transfersExpanded = localStorage.getItem(LS_TR_OPEN) !== "0";

        migrate();

        const $locations = document.getElementById("locations");
        const $summary = document.getElementById("summary");
        const $newName = document.getElementById("new-name");
        const $addBtn = document.getElementById("add-btn");
        const $moveBtn = document.getElementById("move-btn");
        const $transfersSection = document.getElementById("transfers-section");
        const $transfersToggle = document.getElementById("transfers-toggle");
        const $transfersChevron = document.getElementById("transfers-chevron");
        const $transfersCount = document.getElementById("transfers-count");
        const $transfers = document.getElementById("transfers");
        const $teams = document.getElementById("teams");
        const $notes = document.getElementById("notes");
        const $themeBtn = document.getElementById("theme-btn");

        let refs = { locs: {}, shifts: {} };

        function load(key, fallback) {
          try {
            return JSON.parse(localStorage.getItem(key)) ?? fallback;
          } catch (e) {
            return fallback;
          }
        }
        function saveLocations() {
          localStorage.setItem(LS_LOC, JSON.stringify(locations));
        }
        function saveTransfers() {
          localStorage.setItem(LS_TRANSFERS, JSON.stringify(transfers));
        }
        function saveTeams() {
          localStorage.setItem(LS_TEAMS, JSON.stringify(teams));
        }

        // Bring older/loose data into the current shape.
        function migrate() {
          if (!Array.isArray(locations)) locations = [];
          if (!Array.isArray(transfers)) transfers = [];
          let maxLoc = 0,
            maxShift = 0,
            maxTr = 0;
          for (const loc of locations) {
            if (typeof loc.id !== "number") loc.id = maxLoc + 1;
            maxLoc = Math.max(maxLoc, loc.id);
            if (typeof loc.expanded !== "boolean") loc.expanded = false;
            if (typeof loc.manager !== "string") loc.manager = "";
            delete loc.note;
            if (!Array.isArray(loc.shifts)) {
              const p = loc.planned || 0,
                a = loc.actual || 0;
              loc.shifts =
                p || a
                  ? [{ id: 0, start: "", end: "", planned: p, actual: a }]
                  : [];
            }
            delete loc.planned;
            delete loc.actual;
            for (const s of loc.shifts)
              maxShift = Math.max(maxShift, s.id || 0);
          }
          for (const t of transfers) maxTr = Math.max(maxTr, t.id || 0);
          nextId = maxLoc + 1;
          sid = maxShift + 1;
          tid = maxTr + 1;
          for (const loc of locations)
            for (const s of loc.shifts) if (!s.id) s.id = sid++;
          // Drop transfers that reference a location that no longer exists.
          const ids = new Set(locations.map((l) => l.id));
          transfers = transfers.filter((t) => ids.has(t.from) && ids.has(t.to));

          // Standby teams.
          if (!Array.isArray(teams)) teams = [];
          let maxTeam = 0;
          for (const tm of teams) {
            if (typeof tm.id !== "number") tm.id = maxTeam + 1;
            maxTeam = Math.max(maxTeam, tm.id);
            tm.size = Math.max(0, parseInt(tm.size, 10) || 0);
            // location is a location id, or null for the standby pool.
            if (tm.location != null && !ids.has(tm.location))
              tm.location = null;
          }
          teamId = maxTeam + 1;
        }

        function locById(id) {
          return locations.find((l) => l.id === id);
        }
        function nameOf(id) {
          const l = locById(id);
          return l ? l.name : "(removed)";
        }

        function shiftTotals(loc) {
          return loc.shifts.reduce(
            (a, s) => ({
              planned: a.planned + s.planned,
              actual: a.actual + s.actual,
            }),
            { planned: 0, actual: 0 },
          );
        }

        // Standby team members assigned to a given location.
        function standbyForLocation(locId) {
          return teams.reduce(
            (n, tm) => n + (tm.location === locId ? tm.size : 0),
            0,
          );
        }
        // Unassigned reserve (teams sitting on 'Standby').
        function reservePool() {
          return teams.reduce(
            (n, tm) => n + (tm.location == null ? tm.size : 0),
            0,
          );
        }

        // People borrowed in (positive) minus people loaned out (negative).
        function netTransfer(locId) {
          let n = 0;
          for (const t of transfers) {
            if (t.to === locId) n += t.count;
            if (t.from === locId) n -= t.count;
          }
          return n;
        }

        // Headcount actually standing at a location: rostered, adjusted for
        // transfers in/out, plus any standby team parked there.
        function effectiveActual(loc) {
          return (
            shiftTotals(loc).actual +
            netTransfer(loc.id) +
            standbyForLocation(loc.id)
          );
        }

        function diffInfo(planned, actual) {
          const d = actual - planned;
          if (d < 0) return { cls: "under", label: String(d) };
          if (d > 0) return { cls: "over", label: "+" + d };
          return { cls: "matched", label: "0" };
        }

        function setDiff(el, planned, actual) {
          const info = diffInfo(planned, actual);
          const isCol = el.classList.contains("col-diff");
          el.className = "diff " + info.cls + (isCol ? " col-diff" : "");
          el.textContent = info.label;
        }

        /* ---------- Confirmation modal ---------- */

        function confirmModal({ title, message, confirmLabel = "Delete" }) {
          return new Promise((resolve) => {
            const prevFocus = document.activeElement;
            const overlay = document.createElement("div");
            overlay.className = "modal-overlay";

            const modal = document.createElement("div");
            modal.className = "modal";
            modal.setAttribute("role", "dialog");
            modal.setAttribute("aria-modal", "true");

            const h = document.createElement("h2");
            h.textContent = title;
            const p = document.createElement("p");
            p.textContent = message;

            const actions = document.createElement("div");
            actions.className = "modal-actions";
            const cancel = document.createElement("button");
            cancel.className = "btn-ghost";
            cancel.textContent = "Cancel";
            const confirm = document.createElement("button");
            confirm.className = "btn-danger";
            confirm.textContent = confirmLabel;
            actions.appendChild(cancel);
            actions.appendChild(confirm);

            modal.appendChild(h);
            modal.appendChild(p);
            modal.appendChild(actions);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            cancel.focus();

            function close(result) {
              document.removeEventListener("keydown", onKey);
              overlay.remove();
              if (prevFocus && prevFocus.focus) prevFocus.focus();
              resolve(result);
            }
            function onKey(e) {
              if (e.key === "Escape") close(false);
              else if (e.key === "Enter") close(true);
            }
            cancel.addEventListener("click", () => close(false));
            confirm.addEventListener("click", () => close(true));
            overlay.addEventListener("click", (e) => {
              if (e.target === overlay) close(false);
            });
            document.addEventListener("keydown", onKey);
          });
        }

        /* ---------- Render locations ---------- */

        function render() {
          $locations.innerHTML = "";
          refs = { locs: {}, shifts: {} };

          if (locations.length === 0) {
            const e = document.createElement("div");
            e.className = "empty";
            e.textContent = "No locations yet. Add one above to get started.";
            $locations.appendChild(e);
          } else {
            for (const loc of locations) $locations.appendChild(renderLoc(loc));
          }

          refreshComputed();
          renderTransfers();
          renderTeams();
        }

        function renderLoc(loc) {
          const card = document.createElement("div");
          card.className = "loc";

          const head = document.createElement("div");
          head.className = "loc-head";

          const exp = document.createElement("button");
          exp.className = "exp";
          exp.textContent = loc.expanded ? "▾" : "▸";
          exp.title = loc.expanded ? "Collapse" : "Expand";

          const title = document.createElement("div");
          title.className = "loc-title";
          const titleMain = document.createElement("div");
          titleMain.className = "loc-title-main";
          const name = document.createElement("span");
          name.className = "loc-name";
          name.textContent = loc.name;
          name.title = loc.name;
          const manager = document.createElement("span");
          manager.className = "loc-manager";
          if (loc.manager.trim()) {
            manager.textContent = loc.manager;
            manager.title = "Bar manager: " + loc.manager;
          } else {
            manager.style.display = "none";
          }
          const count = document.createElement("span");
          count.className = "shift-count";
          const loan = document.createElement("span");
          loan.className = "loan";
          loan.style.display = "none";
          const standbyChip = document.createElement("span");
          standbyChip.className = "standby-chip";
          standbyChip.style.display = "none";
          titleMain.appendChild(name);
          titleMain.appendChild(manager);
          titleMain.appendChild(count);
          titleMain.appendChild(loan);
          titleMain.appendChild(standbyChip);
          title.appendChild(titleMain);

          const toggle = () => {
            loc.expanded = !loc.expanded;
            saveLocations();
            render();
          };
          exp.addEventListener("click", toggle);
          title.addEventListener("click", toggle);

          const plannedField = statField("Planned");
          const actualField = statField("Actual");

          const diffWrap = document.createElement("div");
          diffWrap.className = "field";
          const diffLabel = document.createElement("label");
          diffLabel.textContent = "Diff";
          const diffVal = document.createElement("div");
          diffVal.className = "diff";
          diffWrap.appendChild(diffLabel);
          diffWrap.appendChild(diffVal);

          const editBtn = document.createElement("button");
          editBtn.className = "btn-edit";
          editBtn.innerHTML = "&#9998;";
          editBtn.title = "Edit name & manager";
          editBtn.setAttribute("aria-label", "Edit " + loc.name);
          editBtn.addEventListener("click", () => editLocationModal(loc));

          const del = document.createElement("button");
          del.className = "btn-del";
          del.innerHTML = "&times;";
          del.title = "Remove location";
          del.setAttribute("aria-label", "Remove " + loc.name);
          del.addEventListener("click", async () => {
            const n = loc.shifts.length;
            const shiftsNote = n
              ? " and its " + n + (n === 1 ? " shift" : " shifts")
              : "";
            const ok = await confirmModal({
              title: "Delete location?",
              message:
                "“" +
                (loc.name.trim() || "This location") +
                "”" +
                shiftsNote +
                " will be permanently removed.",
            });
            if (!ok) return;
            locations = locations.filter((l) => l.id !== loc.id);
            transfers = transfers.filter(
              (t) => t.from !== loc.id && t.to !== loc.id,
            );
            // Any standby teams here fall back to the reserve pool.
            for (const tm of teams)
              if (tm.location === loc.id) tm.location = null;
            saveLocations();
            saveTransfers();
            saveTeams();
            render();
          });

          // Stats and actions are grouped so the narrow layout can move them
          // around as blocks; on wide screens both wrappers are
          // `display: contents`, so the head stays one flat flex row.
          const stats = document.createElement("div");
          stats.className = "loc-stats";
          stats.appendChild(plannedField.wrap);
          stats.appendChild(actualField.wrap);
          stats.appendChild(diffWrap);

          const actions = document.createElement("div");
          actions.className = "loc-actions";
          actions.appendChild(editBtn);
          actions.appendChild(del);

          head.appendChild(exp);
          head.appendChild(title);
          head.appendChild(stats);
          head.appendChild(actions);
          card.appendChild(head);

          refs.locs[loc.id] = {
            planned: plannedField.val,
            actual: actualField.val,
            diff: diffVal,
            count: count,
            loan: loan,
            standbyChip: standbyChip,
            name: name,
            manager: manager,
          };

          if (loc.expanded) card.appendChild(renderShifts(loc));
          return card;
        }

        function statField(labelText) {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const label = document.createElement("label");
          label.textContent = labelText;
          const val = document.createElement("span");
          val.className = "val";
          val.textContent = "0";
          wrap.appendChild(label);
          wrap.appendChild(val);
          return { wrap, val };
        }

        function modalField(labelText, value, placeholder) {
          const field = document.createElement("div");
          field.className = "loc-field";
          const label = document.createElement("label");
          label.textContent = labelText;
          const input = document.createElement("input");
          input.type = "text";
          input.value = value || "";
          input.placeholder = placeholder;
          field.appendChild(label);
          field.appendChild(input);
          return { field, input };
        }

        function editLocationModal(loc) {
          const prevFocus = document.activeElement;
          const overlay = document.createElement("div");
          overlay.className = "modal-overlay";
          const modal = document.createElement("div");
          modal.className = "modal";
          modal.setAttribute("role", "dialog");
          modal.setAttribute("aria-modal", "true");

          const h = document.createElement("h2");
          h.textContent = "Edit location";

          const fields = document.createElement("div");
          fields.className = "modal-fields";
          const nameField = modalField(
            "Location name",
            loc.name,
            "Location name",
          );
          const managerField = modalField(
            "Bar manager",
            loc.manager,
            "e.g. Vince",
          );
          fields.appendChild(nameField.field);
          fields.appendChild(managerField.field);

          const actions = document.createElement("div");
          actions.className = "modal-actions";
          const cancel = document.createElement("button");
          cancel.className = "btn-ghost";
          cancel.textContent = "Cancel";
          const save = document.createElement("button");
          save.className = "btn-confirm";
          save.textContent = "Save";
          actions.appendChild(cancel);
          actions.appendChild(save);

          modal.appendChild(h);
          modal.appendChild(fields);
          modal.appendChild(actions);
          overlay.appendChild(modal);
          document.body.appendChild(overlay);
          nameField.input.focus();
          nameField.input.select();

          function close() {
            document.removeEventListener("keydown", onKey);
            overlay.remove();
            if (prevFocus && prevFocus.focus) prevFocus.focus();
          }
          function commit() {
            loc.name = nameField.input.value;
            loc.manager = managerField.input.value;
            saveLocations();
            close();
            render();
          }
          function onKey(e) {
            if (e.key === "Escape") close();
            else if (e.key === "Enter") commit();
          }
          cancel.addEventListener("click", close);
          save.addEventListener("click", commit);
          overlay.addEventListener("click", (e) => {
            if (e.target === overlay) close();
          });
          document.addEventListener("keydown", onKey);
        }

        function renderShifts(loc) {
          const panel = document.createElement("div");
          panel.className = "shifts";

          if (loc.shifts.length > 0) {
            const headRow = document.createElement("div");
            headRow.className = "shifts-head";
            headRow.innerHTML =
              '<span class="col-times">Shift</span>' +
              '<span class="col-num">Planned</span>' +
              '<span class="col-num">Actual</span>' +
              '<span class="col-diff">Diff</span>' +
              '<span class="col-del"></span>';
            panel.appendChild(headRow);
            for (const s of loc.shifts) panel.appendChild(renderShift(loc, s));
          } else {
            const none = document.createElement("div");
            none.className = "no-shifts";
            none.textContent = "No shifts yet.";
            panel.appendChild(none);
          }

          const add = document.createElement("button");
          add.className = "btn-shift";
          add.textContent = "+ Add shift";
          add.addEventListener("click", () => {
            loc.shifts.push({
              id: sid++,
              start: "",
              end: "",
              planned: 0,
              actual: 0,
            });
            saveLocations();
            render();
          });
          panel.appendChild(add);

          const standbyBlock = document.createElement("div");
          standbyBlock.className = "loc-standby";
          standbyBlock.style.display = "none";
          const sbLabel = document.createElement("div");
          sbLabel.className = "loc-standby-label";
          sbLabel.textContent = "Standby teams";
          const sbList = document.createElement("div");
          sbList.className = "loc-standby-list";
          standbyBlock.appendChild(sbLabel);
          standbyBlock.appendChild(sbList);
          panel.appendChild(standbyBlock);
          const r = refs.locs[loc.id];
          if (r) {
            r.standbyBlock = standbyBlock;
            r.standbyList = sbList;
          }

          return panel;
        }

        function renderShift(loc, s) {
          const row = document.createElement("div");
          row.className = "shift";

          const times = document.createElement("div");
          times.className = "col-times";
          const start = timeInput(s.start, (v) => {
            s.start = v;
            saveLocations();
          });
          const dash = document.createElement("span");
          dash.className = "dash";
          dash.textContent = "–";
          const end = timeInput(s.end, (v) => {
            s.end = v;
            saveLocations();
          });
          times.appendChild(start);
          times.appendChild(dash);
          times.appendChild(end);

          const planned = numInput(s.planned, (v) => {
            s.planned = v;
            saveLocations();
            refreshComputed();
          });
          const actual = numInput(s.actual, (v) => {
            s.actual = v;
            saveLocations();
            refreshComputed();
          });

          const diff = document.createElement("div");
          diff.className = "diff col-diff";

          const del = document.createElement("button");
          del.className = "btn-del col-del";
          del.innerHTML = "&times;";
          del.title = "Remove shift";
          del.addEventListener("click", async () => {
            const range = s.start && s.end ? s.start + "–" + s.end + " " : "";
            const ok = await confirmModal({
              title: "Delete shift?",
              message: "The " + range + "shift will be removed.",
            });
            if (!ok) return;
            loc.shifts = loc.shifts.filter((x) => x.id !== s.id);
            saveLocations();
            render();
          });

          row.appendChild(times);
          row.appendChild(labelledCell("planned", "Planned", planned));
          row.appendChild(labelledCell("actual", "Actual", actual));
          row.appendChild(labelledCell("diff", "Diff", diff));
          row.appendChild(del);

          refs.shifts[s.id] = diff;
          return row;
        }

        // Pairs a control with a label that only shows on narrow screens, where
        // the shared column header is hidden. Form controls get a <label>, so the
        // text also becomes their accessible name.
        function labelledCell(name, labelText, control) {
          const form = control.tagName === "INPUT" || control.tagName === "SELECT";
          const cell = document.createElement(form ? "label" : "div");
          cell.className = "cell cell-" + name;
          const label = document.createElement("span");
          label.className = "cell-label";
          label.textContent = labelText;
          cell.appendChild(label);
          cell.appendChild(control);
          return cell;
        }

        function timeInput(value, onChange) {
          const input = document.createElement("input");
          input.type = "time";
          input.value = value || "";
          input.addEventListener("change", () => onChange(input.value));
          return input;
        }

        function numInput(value, onChange) {
          const input = document.createElement("input");
          input.type = "number";
          input.min = "0";
          input.className = "col-num";
          input.value = value;
          input.addEventListener("input", () => {
            onChange(Math.max(0, parseInt(input.value, 10) || 0));
          });
          return input;
        }

        /* ---------- Recompute totals/badges without rebuilding inputs ---------- */

        function refreshComputed() {
          let gp = 0,
            ga = 0;
          for (const loc of locations) {
            const t = shiftTotals(loc);
            const net = netTransfer(loc.id);
            const standby = standbyForLocation(loc.id);
            const actual = effectiveActual(loc);
            gp += t.planned;
            ga += actual;

            for (const s of loc.shifts) {
              const el = refs.shifts[s.id];
              if (el) setDiff(el, s.planned, s.actual);
            }

            const r = refs.locs[loc.id];
            if (r) {
              r.planned.textContent = t.planned;
              r.actual.textContent = actual;
              setDiff(r.diff, t.planned, actual);
              r.count.textContent =
                loc.shifts.length +
                (loc.shifts.length === 1 ? " shift" : " shifts");
              if (net > 0) {
                r.loan.style.display = "";
                r.loan.className = "loan in";
                r.loan.textContent = "+" + net + " borrowed";
              } else if (net < 0) {
                r.loan.style.display = "";
                r.loan.className = "loan out";
                r.loan.textContent = net + " loaned";
              } else {
                r.loan.style.display = "none";
                r.loan.textContent = "";
              }
              if (standby > 0) {
                r.standbyChip.style.display = "";
                r.standbyChip.textContent = "+" + standby + " standby";
              } else {
                r.standbyChip.style.display = "none";
                r.standbyChip.textContent = "";
              }
              if (r.standbyList) refreshStandbyList(loc, r);
            }
          }
          renderSummary(gp, ga, reservePool());
        }

        function refreshStandbyList(loc, r) {
          const assigned = teams.filter((tm) => tm.location === loc.id);
          r.standbyList.innerHTML = "";
          if (assigned.length === 0) {
            r.standbyBlock.style.display = "none";
            return;
          }
          r.standbyBlock.style.display = "";
          for (const tm of assigned) {
            const item = document.createElement("div");
            item.className = "loc-standby-item";
            item.textContent =
              tm.size +
              (tm.size === 1 ? " employee" : " employees") +
              " (standby team)";
            r.standbyList.appendChild(item);
          }
        }

        function renderSummary(planned, actual, reserve) {
          if (locations.length === 0 && !reserve) {
            $summary.textContent = "";
            return;
          }
          const d = actual - planned;
          const sign = d > 0 ? "+" + d : String(d);
          let html =
            "<b>" +
            actual +
            "</b>/" +
            planned +
            " staffed &middot; " +
            locations.length +
            " location" +
            (locations.length === 1 ? "" : "s") +
            " &middot; net <b>" +
            sign +
            "</b>";
          if (reserve > 0)
            html += " &middot; <b>" + reserve + "</b> on standby";
          $summary.innerHTML = html;
        }

        /* ---------- Move / transfers ---------- */

        $moveBtn.addEventListener("click", moveModal);

        function moveModal() {
          const prevFocus = document.activeElement;
          const overlay = document.createElement("div");
          overlay.className = "modal-overlay";
          const modal = document.createElement("div");
          modal.className = "modal modal-wide";
          modal.setAttribute("role", "dialog");
          modal.setAttribute("aria-modal", "true");
          modal.setAttribute("aria-label", "Move people");

          const h = document.createElement("h2");
          h.textContent = "Move people";
          modal.appendChild(h);

          function close() {
            document.removeEventListener("keydown", onKey);
            overlay.remove();
            if (prevFocus && prevFocus.focus) prevFocus.focus();
          }
          function onKey(e) {
            if (e.key === "Escape") close();
            else if (e.key === "Enter") commit();
          }

          if (locations.length < 2) {
            const msg = document.createElement("p");
            msg.textContent =
              "Add at least two locations to move people between them.";
            modal.appendChild(msg);
            const actions = document.createElement("div");
            actions.className = "modal-actions";
            const ok = document.createElement("button");
            ok.className = "btn-ghost";
            ok.textContent = "Close";
            ok.addEventListener("click", close);
            actions.appendChild(ok);
            modal.appendChild(actions);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            ok.focus();
            overlay.addEventListener("click", (e) => {
              if (e.target === overlay) close();
            });
            document.addEventListener("keydown", onKey);
            return;
          }

          let fromId = locations[0].id;
          let toId = locations[1].id;

          const cols = document.createElement("div");
          cols.className = "move-cols";
          const fromCol = picker("From", () => fromId, (id) => {
            // Picking the location already on the other side swaps the ends,
            // which keeps every option live instead of greying one out.
            if (id === toId) toId = fromId;
            fromId = id;
            refresh();
          });
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "\u2192";
          const toCol = picker("To", () => toId, (id) => {
            if (id === fromId) fromId = toId;
            toId = id;
            refresh();
          });
          cols.appendChild(fromCol.col);
          cols.appendChild(arrow);
          cols.appendChild(toCol.col);
          modal.appendChild(cols);

          const countRow = document.createElement("div");
          countRow.className = "move-count";
          const countLabel = document.createElement("label");
          countLabel.textContent = "People";
          const count = document.createElement("input");
          count.type = "number";
          count.min = "1";
          count.value = "1";
          count.id = "move-count";
          countLabel.htmlFor = count.id;
          const summary = document.createElement("span");
          summary.className = "move-summary";
          count.addEventListener("input", refresh);
          countRow.appendChild(countLabel);
          countRow.appendChild(count);
          countRow.appendChild(summary);
          modal.appendChild(countRow);

          const actions = document.createElement("div");
          actions.className = "modal-actions";
          const cancel = document.createElement("button");
          cancel.className = "btn-ghost";
          cancel.textContent = "Cancel";
          const confirm = document.createElement("button");
          confirm.className = "btn-confirm";
          confirm.textContent = "Move";
          actions.appendChild(cancel);
          actions.appendChild(confirm);
          modal.appendChild(actions);

          overlay.appendChild(modal);
          document.body.appendChild(overlay);
          refresh();
          count.focus({ preventScroll: true });
          count.select();
          overlay.scrollTop = 0;

          cancel.addEventListener("click", close);
          confirm.addEventListener("click", commit);
          overlay.addEventListener("click", (e) => {
            if (e.target === overlay) close();
          });
          document.addEventListener("keydown", onKey);

          // A labelled, scrollable list of locations. Showing each one's current
          // headcount is the point of picking here rather than in a dropdown.
          function picker(labelText, getSelected, onPick) {
            const col = document.createElement("div");
            col.className = "move-col";
            const label = document.createElement("span");
            label.className = "picker-label";
            label.textContent = labelText;
            const list = document.createElement("div");
            list.className = "picker";
            list.setAttribute("role", "group");
            list.setAttribute("aria-label", labelText);
            col.appendChild(label);
            col.appendChild(list);

            function draw() {
              list.innerHTML = "";
              for (const loc of locations) {
                const opt = document.createElement("button");
                opt.type = "button";
                opt.className = "picker-option";
                const nm = document.createElement("span");
                nm.className = "nm";
                nm.textContent = loc.name;
                const staff = document.createElement("span");
                staff.className = "staff";
                staff.textContent = effectiveActual(loc) + " staffed";
                opt.appendChild(nm);
                opt.appendChild(staff);
                opt.setAttribute(
                  "aria-pressed",
                  loc.id === getSelected() ? "true" : "false",
                );
                opt.addEventListener("click", () => onPick(loc.id));
                list.appendChild(opt);
              }
            }
            return { col, draw };
          }

          function refresh() {
            fromCol.draw();
            toCol.draw();
            const c = Math.max(1, parseInt(count.value, 10) || 0);
            summary.textContent =
              c +
              (c === 1 ? " person from " : " people from ") +
              nameOf(fromId) +
              " to " +
              nameOf(toId);
          }

          function commit() {
            const c = Math.max(1, parseInt(count.value, 10) || 0);
            if (!locById(fromId) || !locById(toId) || fromId === toId) return;
            transfers.push({ id: tid++, from: fromId, to: toId, count: c });
            saveTransfers();
            close();
            render();
          }
        }

        $transfersToggle.addEventListener("click", () => {
          transfersExpanded = !transfersExpanded;
          localStorage.setItem(LS_TR_OPEN, transfersExpanded ? "1" : "0");
          renderTransfers();
        });

        function renderTransfers() {
          if (transfers.length === 0) {
            $transfersSection.style.display = "none";
            $transfers.innerHTML = "";
            return;
          }
          $transfersSection.style.display = "";
          $transfersChevron.textContent = transfersExpanded ? "▾" : "▸";
          $transfersCount.textContent = "(" + transfers.length + ")";
          $transfers.style.display = transfersExpanded ? "" : "none";
          $transfers.innerHTML = "";
          if (!transfersExpanded) return;
          for (const t of transfers) {
            const row = document.createElement("div");
            row.className = "transfer";

            const route = document.createElement("div");
            route.className = "route";
            const f = document.createElement("b");
            f.textContent = nameOf(t.from);
            const via = document.createElement("span");
            via.className = "via";
            via.textContent = "→";
            const to = document.createElement("b");
            to.textContent = nameOf(t.to);
            route.appendChild(f);
            route.appendChild(via);
            route.appendChild(to);

            const cnt = document.createElement("span");
            cnt.className = "cnt";
            cnt.innerHTML =
              "<b>" + t.count + "</b> " + (t.count === 1 ? "person" : "people");

            const del = document.createElement("button");
            del.className = "btn-del";
            del.innerHTML = "&times;";
            del.title = "Undo transfer";
            del.addEventListener("click", () => {
              transfers = transfers.filter((x) => x.id !== t.id);
              saveTransfers();
              render();
            });

            row.appendChild(route);
            row.appendChild(cnt);
            row.appendChild(del);
            $transfers.appendChild(row);
          }
        }

        /* ---------- Standby teams ---------- */

        function renderTeams() {
          $teams.innerHTML = "";

          if (teams.length === 0) {
            const empty = document.createElement("div");
            empty.className = "teams-empty";
            empty.textContent =
              "No standby teams yet. Add one to keep a group in reserve.";
            $teams.appendChild(empty);
          } else {
            for (const tm of teams) $teams.appendChild(renderTeamRow(tm));
          }

          const add = document.createElement("button");
          add.className = "btn-team";
          add.textContent = "+ Add team";
          add.addEventListener("click", () => {
            teams.push({ id: teamId++, size: 1, location: null });
            saveTeams();
            render();
          });
          $teams.appendChild(add);
        }

        function renderTeamRow(tm) {
          const row = document.createElement("div");
          row.className = "team";

          const size = document.createElement("input");
          size.type = "number";
          size.min = "0";
          size.value = tm.size;
          // The adjacent "employees" text reads as its label but isn't one.
          size.setAttribute("aria-label", "Employees");
          size.addEventListener("input", () => {
            tm.size = Math.max(0, parseInt(size.value, 10) || 0);
            saveTeams();
            refreshComputed();
          });

          const label = document.createElement("span");
          label.className = "mini";
          label.textContent = "employees";

          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";

          const select = document.createElement("select");
          for (const loc of locations) {
            const o = document.createElement("option");
            o.value = String(loc.id);
            o.textContent = loc.name;
            select.appendChild(o);
          }
          const standbyOpt = document.createElement("option");
          standbyOpt.value = "standby";
          standbyOpt.textContent = "Standby";
          select.appendChild(standbyOpt);
          select.value = tm.location == null ? "standby" : String(tm.location);
          select.addEventListener("change", () => {
            tm.location =
              select.value === "standby" ? null : parseInt(select.value, 10);
            saveTeams();
            refreshComputed();
          });

          const del = document.createElement("button");
          del.className = "btn-del";
          del.innerHTML = "&times;";
          del.title = "Remove team";
          del.addEventListener("click", () => {
            teams = teams.filter((x) => x.id !== tm.id);
            saveTeams();
            render();
          });

          row.appendChild(size);
          row.appendChild(label);
          row.appendChild(arrow);
          row.appendChild(labelledCell("team-loc", "Assigned to", select));
          row.appendChild(del);
          return row;
        }

        /* ---------- Adding locations ---------- */

        function addLocation() {
          const nm = $newName.value.trim();
          if (!nm) return;
          locations.push({
            id: nextId++,
            name: nm,
            expanded: true,
            manager: "",
            shifts: [],
          });
          $newName.value = "";
          saveLocations();
          render();
          $newName.focus();
        }

        $addBtn.addEventListener("click", addLocation);
        $newName.addEventListener("keydown", (e) => {
          if (e.key === "Enter") addLocation();
        });

        /* ---------- Theme ---------- */

        const root = document.documentElement;

        function effectiveTheme() {
          const attr = root.getAttribute("data-theme");
          if (attr === "light" || attr === "dark") return attr;
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        function updateThemeButton() {
          const t = effectiveTheme();
          $themeBtn.textContent = t === "dark" ? "☾" : "☀";
          $themeBtn.title =
            t === "dark" ? "Switch to light mode" : "Switch to dark mode";
        }

        $themeBtn.addEventListener("click", () => {
          const next = effectiveTheme() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          localStorage.setItem(LS_THEME, next);
          updateThemeButton();
        });

        updateThemeButton();

        /* ---------- Notes ---------- */

        $notes.value = localStorage.getItem(LS_NOTES) || "";
        let notesTimer = null;
        $notes.addEventListener("input", () => {
          clearTimeout(notesTimer);
          notesTimer = setTimeout(
            () => localStorage.setItem(LS_NOTES, $notes.value),
            250,
          );
        });

        render();
      })();
    </script>
  </body>
</html>
