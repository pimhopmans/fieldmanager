          const actions = document.createElement("div");
          actions.className = "modal-actions";
          const done = document.createElement("button");
          done.className = "btn-ghost";
          done.textContent = "Close";
          actions.appendChild(done);

          modal.appendChild(h);
          modal.appendChild(ta);
          modal.appendChild(actions);
          overlay.appendChild(modal);
          document.body.appendChild(overlay);
          ta.focus();
          ta.select();

          function close() {
            popModal(token);
            document.removeEventListener("keydown", onKey);
            overlay.remove();
            if (prevFocus && prevFocus.focus) prevFocus.focus();
          }
          function onKey(e) {
            if (isTopModal(token) && e.key === "Escape") close();
          }
          done.addEventListener("click", close);
          overlay.addEventListener("click", (e) => {
            if (e.target === overlay) close();
          });
          document.addEventListener("keydown", onKey);
        }

        async function editLocationModal(loc) {
          const values = await formModal({
            title: "Edit location",
            fields: [
              {
                label: "Location name",
                value: loc.name,
                placeholder: "Location name",
              },
              {
                label: "Bar manager",
                value: loc.manager,
                placeholder: "e.g. Vince",
              },
              {
                label: "Area",
                value: loc.area,
                placeholder: "Area",
                list: areaList(),
              },
            ],
          });
          if (!values) return;
          loc.name = values[0];
          loc.manager = values[1];
          // Retagging is how you hand a location to another area; blank reads
          // as "leave it here". Editing it by hand also claims it as real, so
          // pruneForeign() stops treating it as a throwaway endpoint.
          loc.area = values[2].trim() || myArea;
          addArea(loc.area);
          loc.foreign = false;
          saveLocations();
          render();
        }

        function renderShifts(loc) {
          const panel = document.createElement("div");
          panel.className = "shifts";

          if (loc.shifts.length > 0) {
            const headRow = document.createElement("div");
            headRow.className = "shifts-head";
            headRow.innerHTML =
              '<span class="col-times">Shift</span>' +
              '<span class="col-num">Planned</span>' +
              '<span class="col-num">Actual</span>' +
              '<span class="col-diff">Diff</span>' +
              '<span class="col-del"></span>';
            panel.appendChild(headRow);
            for (const s of loc.shifts) panel.appendChild(renderShift(loc, s));
          } else {
            const none = document.createElement("div");
            none.className = "no-shifts";
            none.textContent = "No shifts yet.";
            panel.appendChild(none);
          }

          const add = document.createElement("button");
          add.className = "btn-shift";
          add.textContent = "+ Add shift";
          add.addEventListener("click", () => {
            loc.shifts.push({
              id: sid++,
              start: "",
              end: "",
              planned: 0,
              actual: 0,
            });
            saveLocations();
            render();
          });
          panel.appendChild(add);

          const standbyBlock = document.createElement("div");
          standbyBlock.className = "loc-standby";
          standbyBlock.style.display = "none";
          const sbLabel = document.createElement("div");
          sbLabel.className = "loc-standby-label";
          sbLabel.textContent = "Standby teams";
          const sbList = document.createElement("div");
          sbList.className = "loc-standby-list";
          standbyBlock.appendChild(sbLabel);
          standbyBlock.appendChild(sbList);
          panel.appendChild(standbyBlock);
          const r = refs.locs[loc.id];
          if (r) {
            r.standbyBlock = standbyBlock;
            r.standbyList = sbList;
          }

          return panel;
        }

        function renderShift(loc, s) {
          const row = document.createElement("div");
          row.className = "shift";

          const times = document.createElement("div");
          times.className = "col-times";
          const start = timeInput(s.start, (v) => {
            s.start = v;
            saveLocations();
            refreshComputed();
          });
          const dash = document.createElement("span");
          dash.className = "dash";
          dash.textContent = "–";
          const end = timeInput(s.end, (v) => {
            s.end = v;
            saveLocations();
            refreshComputed();
          });
          // Marks the row the Now figures are being read from.
          const nowBadge = document.createElement("span");
          nowBadge.className = "now-badge";
          nowBadge.textContent = "now";
          // Hidden, not removed: the badge keeps its box so every shift row in
          // a location lines its time inputs up, running or not.
          nowBadge.style.visibility = "hidden";
          times.appendChild(start);
          times.appendChild(dash);
          times.appendChild(end);
          times.appendChild(nowBadge);

          const planned = numInput(s.planned, (v) => {
            s.planned = v;
            saveLocations();
            refreshComputed();
          });
          const actual = numInput(s.actual, (v) => {
            s.actual = v;
            saveLocations();
            refreshComputed();
          });

          const diff = document.createElement("div");
          diff.className = "diff col-diff";

          const del = document.createElement("button");
          del.className = "btn-del col-del";
          del.innerHTML = "&times;";
          del.title = "Remove shift";
          // No confirmation: one tap to remove, and the toast holds the undo.
          del.addEventListener("click", () => {
            const idx = loc.shifts.indexOf(s);
            loc.shifts = loc.shifts.filter((x) => x.id !== s.id);
            saveLocations();
            render();
            toast("Removed " + shiftRange(s) + " shift", {
              action: () => {
                loc.shifts.splice(Math.min(idx, loc.shifts.length), 0, s);
                saveLocations();
                render();
              },
            });
          });

          row.appendChild(times);
          row.appendChild(labelledCell("planned", "Planned", planned));
          row.appendChild(labelledCell("actual", "Actual", actual));
          row.appendChild(labelledCell("diff", "Diff", diff));
          row.appendChild(del);

          refs.shifts[s.id] = diff;
          refs.rows[s.id] = { row: row, badge: nowBadge };
          return row;
        }

        // Pairs a control with a label that only shows on narrow screens, where
        // the shared column header is hidden. Form controls get a <label>, so the
        // text also becomes their accessible name.
        function labelledCell(name, labelText, control) {
          const form =
            control.tagName === "INPUT" || control.tagName === "SELECT";
          const cell = document.createElement(form ? "label" : "div");
          cell.className = "cell cell-" + name;
          const label = document.createElement("span");
          label.className = "cell-label";
          label.textContent = labelText;
          cell.appendChild(label);
          cell.appendChild(control);
          return cell;
        }

        function timeInput(value, onChange) {
          const input = document.createElement("input");
          input.type = "time";
          input.value = value || "";
          input.addEventListener("change", () => onChange(input.value));
          return input;
        }

        function numInput(value, onChange) {
          const input = document.createElement("input");
          input.type = "number";
          input.min = "0";
          input.className = "col-num";
          input.value = value;
          input.addEventListener("input", () => {
            onChange(Math.max(0, parseInt(input.value, 10) || 0));
          });
          return input;
        }

        /* ---------- Recompute totals/badges without rebuilding inputs ---------- */

        function refreshComputed() {
          nowM = nowMinutes();
          let gp = 0,
            ga = 0;
          const mine = myLocations();
          for (const loc of mine) {
            const t = viewTotals(loc);
            const st = t.st || nowState(loc, nowM);
            const net = netTransfer(loc.id);
            const standby = standbyForLocation(loc.id);
            gp += t.planned;
            ga += t.actual;

            for (const s of loc.shifts) {
              const el = refs.shifts[s.id];
              if (el) setDiff(el, s.planned, s.actual);
              const row = refs.rows[s.id];
              if (row) {
                const on =
                  view === "now" && !st.untimed && st.active.indexOf(s) !== -1;
                row.row.classList.toggle("is-now", on);
                row.badge.style.visibility = on ? "visible" : "hidden";
              }
            }

            const r = refs.locs[loc.id];
            if (r) {
              r.planned.textContent = t.planned;
              r.actual.textContent = t.actual;
              setDiff(r.diff, t.planned, t.actual);
              setShiftLabel(r.count, loc, st);
              setNextChip(r.next, st);
              if (net > 0) {
                r.loan.style.display = "";
                r.loan.className = "loan in";
                r.loan.textContent = "+" + net + " borrowed";
              } else if (net < 0) {
                r.loan.style.display = "";
                r.loan.className = "loan out";
                r.loan.textContent = net + " loaned";
              } else {
                r.loan.style.display = "none";
                r.loan.textContent = "";
              }
              if (standby > 0) {
                r.standbyChip.style.display = "";
                r.standbyChip.textContent = "+" + standby + " standby";
              } else {
                r.standbyChip.style.display = "none";
                r.standbyChip.textContent = "";
              }
              if (r.standbyList) refreshStandbyList(loc, r);
            }
          }
          renderSummary(gp, ga, reservePool(), mine.length);
        }

        // In the Now view this line says which shift the card's figures come
        // from; in the All day view it goes back to counting shifts.
        function setShiftLabel(el, loc, st) {
          const n = loc.shifts.length;
          const shiftCount = n ? plural(n, "shift", "shifts") : "no shifts";
          el.className = "shift-count";
          if (view !== "now") {
            el.textContent = shiftCount;
          } else if (st.untimed) {
            el.textContent = n ? shiftCount + " · no times set" : shiftCount;
          } else if (st.active.length === 1) {
            el.textContent = shiftRange(st.active[0]);
          } else if (st.active.length > 1) {
            el.textContent = st.active.length + " shifts running";
          } else {
            el.className = "shift-count closed";
            el.textContent = "closed";
          }
        }

        // The changeover ahead. Always shown while a location is closed, and
        // once a running shift is within striking distance of handing over.
        function setNextChip(el, st) {
          const soonMin = 45;
          const show =
            view === "now" &&
            st.next &&
            !st.untimed &&
            (st.active.length === 0 || st.nextIn <= soonMin);
          if (!show) {
            el.style.display = "none";
            el.textContent = "";
            return;
          }
          const soon = st.nextIn <= soonMin;
          el.style.display = "";
          el.className = "next-chip" + (soon ? " soon" : "");
          el.textContent =
            st.next.start +
            " in " +
            fmtIn(st.nextIn) +
            (st.next.planned ? " · needs " + st.next.planned : "");
        }

        function refreshStandbyList(loc, r) {
          const assigned = teams.filter((tm) => tm.location === loc.id);
          r.standbyList.innerHTML = "";
          if (assigned.length === 0) {
            r.standbyBlock.style.display = "none";
            return;
          }
          r.standbyBlock.style.display = "";
          for (const tm of assigned) {
            const item = document.createElement("div");
            item.className = "loc-standby-item";
            item.textContent =
              plural(tm.size, "employee", "employees") + " (standby team)";
            r.standbyList.appendChild(item);
          }
        }

        function renderSummary(planned, actual, reserve, nLoc) {
          if (nLoc === 0 && !reserve) {
            $summary.textContent = "";
            return;
          }
          let html =
            (view === "now" ? "At " + clock() : "All day") +
            " &middot; <b>" +
            actual +
            "</b>/" +
            planned +
            " present" +
            " &middot; " +
            nLoc +
            " location" +
            (nLoc === 1 ? "" : "s") +
            " &middot; net <b>" +
            signed(actual - planned) +
            "</b>";
          if (reserve > 0)
            html += " &middot; <b>" + reserve + "</b> on standby";
          $summary.innerHTML = html;
        }

        /* ---------- Copy summary ---------- */

        // A paste-ready block for the group chat: the way this information
        // actually travels on a field. Short locations lead, because they are
        // the ones somebody has to do something about.
        function summaryText() {
          const mine = myLocations();
          const rows = mine.map((loc) => {
            const t = viewTotals(loc);
            return {
              loc: loc,
              planned: t.planned,
              actual: t.actual,
              diff: t.actual - t.planned,
              st: t.st,
            };
          });
          const gp = rows.reduce((n, r) => n + r.planned, 0);
          const ga = rows.reduce((n, r) => n + r.actual, 0);
          const reserve = reservePool();

          const lines = [];
          lines.push(
            "Field Manager · " +
              myArea +
              " · " +
              clock() +
              (view === "now" ? "" : " · all day"),
          );
          lines.push(
            "present " +
              ga +
              "/" +
              gp +
              " (" +
              signed(ga - gp) +
              ") · " +
              plural(mine.length, "location", "locations") +
              (reserve ? " · " + reserve + " on standby" : ""),
          );

          const isClosed = (r) =>
            r.st && !r.st.untimed && r.st.active.length === 0 && r.actual === 0;
          const short = rows
            .filter((r) => r.diff < 0)
            .sort((a, b) => a.diff - b.diff);
          const closed = rows.filter((r) => r.diff >= 0 && isClosed(r));
          const ok = rows.filter((r) => r.diff >= 0 && !isClosed(r));

          function row(r) {
            const bits = [
              r.actual + "/" + r.planned + " (" + signed(r.diff) + ")",
            ];
            if (r.st && !r.st.untimed && r.st.active.length === 1)
              bits.push(shiftRange(r.st.active[0]));
            if (r.loc.manager.trim()) bits.push(r.loc.manager.trim());
            return "- " + r.loc.name + " — " + bits.join(" · ");
          }

          if (short.length) {
            lines.push("");
            lines.push("SHORT (" + short.length + ")");
            for (const r of short) lines.push(row(r));
          }
          if (ok.length) {
            lines.push("");
            lines.push("OK (" + ok.length + ")");
            for (const r of ok) lines.push(row(r));
          }
          if (closed.length) {
            lines.push("");
            lines.push("CLOSED (" + closed.length + ")");
            for (const r of closed)
              lines.push(
                "- " +
                  r.loc.name +
                  (r.st.next
                    ? " — next " + r.st.next.start + " in " + fmtIn(r.st.nextIn)
                    : ""),
              );
          }
          if (transfers.length) {
            lines.push("");
            lines.push("MOVES (" + transfers.length + ")");
            for (const t of orderedTransfers())
              lines.push(
                "- " +
                  (t.at ? hhmm(new Date(t.at)) + " " : "") +
                  labelOf(t.from) +
                  " -> " +
                  labelOf(t.to) +
                  ": " +
                  t.count,
              );
          }
          return lines.join("\n");
        }

        function legacyCopy(text) {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "0";
          ta.style.left = "0";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch (e) {
            ok = false;
          }
          ta.remove();
          return ok;
        }

        $copyBtn.addEventListener("click", async () => {
          const text = summaryText();
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(text);
              toast("Summary copied");
              return;
            }
          } catch (e) {
            /* fall through to the textarea route */
          }
          if (legacyCopy(text)) toast("Summary copied");
          else textModal("Summary", text);
        });

        /* ---------- Move / transfers ---------- */

        $moveBtn.addEventListener("click", moveModal);

        function moveModal() {
          const token = pushModal();
          const prevFocus = document.activeElement;
          const overlay = document.createElement("div");
          overlay.className = "modal-overlay";
          const modal = document.createElement("div");
          modal.className = "modal modal-wide";
          modal.setAttribute("role", "dialog");
          modal.setAttribute("aria-modal", "true");
          modal.setAttribute("aria-label", "Move people");

          const h = document.createElement("h2");
          h.textContent = "Move people";
          modal.appendChild(h);

          function close() {
            popModal(token);
            document.removeEventListener("keydown", onKey);
            overlay.remove();
            if (prevFocus && prevFocus.focus) prevFocus.focus();
          }
          // Leaving without moving anyone can orphan a just-added out-of-area
          // location, and render() is what clears those out.
          function dismiss() {
            close();
            render();
          }
          function onKey(e) {
            if (!isTopModal(token)) return;
            if (e.key === "Escape") dismiss();
            else if (e.key === "Enter") commit();
          }

          if (locations.length === 0) {
            const msg = document.createElement("p");
            msg.textContent =
              "Add a location first, then you can move people between them.";
            modal.appendChild(msg);
            const actions = document.createElement("div");
            actions.className = "modal-actions";
            const ok = document.createElement("button");
            ok.className = "btn-ghost";
            ok.textContent = "Close";
            ok.addEventListener("click", close);
            actions.appendChild(ok);
            modal.appendChild(actions);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            ok.focus();
            overlay.addEventListener("click", (e) => {
              if (e.target === overlay) close();
            });
            document.addEventListener("keydown", onKey);
            return;
          }

          // Prefer your own locations for the initial pair. With only one
          // location to hand, the other end starts empty and has to be picked
          // or created — that is the out-of-area case.
          const mine = myLocations();
          let fromId = (mine.length ? mine : locations)[0].id;
          let toId = null;
          for (const l of mine)
            if (l.id !== fromId) {
              toId = l.id;
              break;
            }
          if (toId == null)
            for (const l of locations)
              if (l.id !== fromId) {
                toId = l.id;
                break;
              }

          const cols = document.createElement("div");
          cols.className = "move-cols";
          const fromCol = picker(
            "From",
            () => fromId,
            (id) => {
              // Picking the location already on the other side swaps the ends,
              // which keeps every option live instead of greying one out.
              if (id === toId) toId = fromId;
              fromId = id;
              refresh();
            },
          );
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";
          const toCol = picker(
            "To",
            () => toId,
            (id) => {
              if (id === fromId) {
                // Nothing on this side to swap back, so ignore rather than
                // pointing the transfer at itself.
                if (toId == null) return;
                fromId = toId;
              }
              toId = id;
              refresh();
            },
          );
          cols.appendChild(fromCol.col);
          cols.appendChild(arrow);
          cols.appendChild(toCol.col);
          modal.appendChild(cols);

          const countRow = document.createElement("div");
          countRow.className = "move-count";
          const countLabel = document.createElement("label");
          countLabel.textContent = "People";
          const count = document.createElement("input");
          count.type = "number";
          count.min = "1";
          count.value = "1";
          count.id = "move-count";
          countLabel.htmlFor = count.id;
          const summary = document.createElement("span");
          summary.className = "move-summary";
          count.addEventListener("input", refresh);
          countRow.appendChild(countLabel);
          countRow.appendChild(count);
          countRow.appendChild(summary);
          modal.appendChild(countRow);

          const actions = document.createElement("div");
          actions.className = "modal-actions";
          const cancel = document.createElement("button");
          cancel.className = "btn-ghost";
          cancel.textContent = "Cancel";
          const confirm = document.createElement("button");
          confirm.className = "btn-confirm";
          confirm.textContent = "Move";
          actions.appendChild(cancel);
          actions.appendChild(confirm);
          modal.appendChild(actions);

          overlay.appendChild(modal);
          document.body.appendChild(overlay);
          refresh();
          count.focus({ preventScroll: true });
          count.select();
          overlay.scrollTop = 0;

          cancel.addEventListener("click", dismiss);
          confirm.addEventListener("click", commit);
          overlay.addEventListener("click", (e) => {
            if (e.target === overlay) dismiss();
          });
          document.addEventListener("keydown", onKey);

          // A labelled, scrollable list of locations. Showing each one's current
          // headcount is the point of picking here rather than in a dropdown.
          // Your area is listed flat; every other area is a collapsed group, so
          // this stays the one place other areas are visible at all.
          function picker(labelText, getSelected, onPick) {
            const col = document.createElement("div");
            col.className = "move-col";
            const label = document.createElement("span");
            label.className = "picker-label";
            label.textContent = labelText;
            const list = document.createElement("div");
            list.className = "picker";
            list.setAttribute("role", "group");
            list.setAttribute("aria-label", labelText);
            col.appendChild(label);
            col.appendChild(list);

            const add = document.createElement("button");
            add.type = "button";
            add.className = "picker-add";
            add.textContent = "+ Another area’s location…";
            add.addEventListener("click", addForeign);
            col.appendChild(add);

            const open = new Set();

            function option(loc, selected, nested) {
              const opt = document.createElement("button");
              opt.type = "button";
              opt.className = "picker-option" + (nested ? " nested" : "");
              const nm = document.createElement("span");
              nm.className = "nm";
              nm.textContent = loc.name;
              opt.appendChild(nm);
              // Another area's roster is not ours to know, so only our own
              // options carry a headcount.
              if (!nested) {
                const staff = document.createElement("span");
                staff.className = "staff";
                staff.textContent = onSiteNow(loc) + " present";
                opt.appendChild(staff);
              }
              opt.setAttribute("aria-pressed", selected ? "true" : "false");
              opt.addEventListener("click", () => onPick(loc.id));
              return opt;
            }

            function groupHeader(area, isOpen, n, onToggle) {
              const b = document.createElement("button");
              b.type = "button";
              b.className = "picker-group";
              b.setAttribute("aria-expanded", isOpen ? "true" : "false");
              const x = document.createElement("span");
              x.className = "gx";
              x.textContent = isOpen ? "▾" : "▸";
              const nm = document.createElement("span");
              nm.className = "gn";
              nm.textContent = area;
              const c = document.createElement("span");
              c.className = "gc";
              c.textContent = String(n);
              b.appendChild(x);
              b.appendChild(nm);
              b.appendChild(c);
              b.addEventListener("click", onToggle);
              return b;
            }

            function draw() {
              list.innerHTML = "";
              const sel = getSelected();
              const own = myLocations();
              for (const loc of own)
                list.appendChild(option(loc, loc.id === sel, false));
              if (own.length === 0) {
                const none = document.createElement("div");
                none.className = "picker-none";
                none.textContent = "No locations in " + myArea + ".";
                list.appendChild(none);
              }

              for (const area of areaList().slice(1)) {
                const inArea = locations.filter((l) => l.area === area);
                // Known-but-empty areas still belong in the switcher and in
                // the suggestions, but there is nothing to pick in them.
                if (inArea.length === 0) continue;
                // A group holding the current pick stays open regardless, so
                // the selection is never hidden behind a collapsed header.
                const isOpen =
                  open.has(area) || inArea.some((l) => l.id === sel);
                list.appendChild(
                  groupHeader(area, isOpen, inArea.length, () => {
                    if (open.has(area)) open.delete(area);
                    else open.add(area);
                    draw();
                  }),
                );
                if (isOpen)
                  for (const loc of inArea)
                    list.appendChild(option(loc, loc.id === sel, true));
              }
            }

            // Records a location you do not manage, purely so it can be one
            // end of this transfer. It never shows in the locations list, and
            // pruneForeign() drops it again if the transfer goes away.
            async function addForeign() {
              const values = await formModal({
                title: "Location in another area",
                fields: [
                  { label: "Location name", placeholder: "e.g. Bar 7" },
                  {
                    label: "Area",
                    placeholder: "e.g. Area B",
                    list: areaList().slice(1),
                  },
                ],
                confirmLabel: "Add",
              });
              if (!values) return;
              const nm = values[0].trim();
              const area = values[1].trim();
              if (!nm || !area) return;
              addArea(area);
              let loc = locations.find(
                (l) =>
                  l.area === area &&
                  l.name.trim().toLowerCase() === nm.toLowerCase(),
              );
              if (!loc) {
                loc = {
                  id: nextId++,
                  name: nm,
                  area: area,
                  expanded: false,
                  manager: "",
                  shifts: [],
                  foreign: true,
                };
                locations.push(loc);
                saveLocations();
              }
              open.add(area);
              onPick(loc.id);
            }

            return { col, draw };
          }

          // The ceiling on this move: you cannot send people who are not
          // there. Another area's roster is not ours to know, so a foreign
          // source is left unchecked rather than guessed at.
          function availableAt(id) {
            const l = locById(id);
            if (!l || isForeign(l)) return null;
            return Math.max(0, onSiteNow(l));
          }

          function refresh() {
            fromCol.draw();
            toCol.draw();
            const c = Math.max(1, parseInt(count.value, 10) || 0);
            const ready = toId != null && fromId !== toId;
            const avail = ready ? availableAt(fromId) : null;
            const over = avail !== null && c > avail;
            confirm.disabled = !ready || over;
            summary.className = "move-summary" + (over ? " warn" : "");
            if (avail !== null) count.max = String(Math.max(1, avail));
            else count.removeAttribute("max");
            if (!ready) {
              summary.textContent = "Pick where the people are going.";
            } else if (over) {
              summary.textContent =
                avail === 0
                  ? "Nobody present at " + labelOf(fromId) + " right now."
                  : "Only " +
                    plural(avail, "person", "people") +
                    " present at " +
                    labelOf(fromId) +
                    ".";
            } else {
              summary.textContent =
                plural(c, "person", "people") +
                " from " +
                labelOf(fromId) +
                " to " +
                labelOf(toId);
            }
          }

          function commit() {
            if (toId == null || fromId === toId) return;
            const c = Math.max(1, parseInt(count.value, 10) || 0);
            if (!locById(fromId) || !locById(toId)) return;
            const avail = availableAt(fromId);
            // Guard again here: Enter reaches this without touching the button.
            if (avail !== null && c > avail) {
              refresh();
              return;
            }
            const to = labelOf(toId);
            transfers.push({
              id: tid++,
              from: fromId,
              to: toId,
              count: c,
              at: Date.now(),
            });
            saveTransfers();
            close();
            render();
            toast("Moved " + plural(c, "person", "people") + " to " + to);
          }
        }

        $transfersToggle.addEventListener("click", () => {
          transfersExpanded = !transfersExpanded;
          localStorage.setItem(LS_TR_OPEN, transfersExpanded ? "1" : "0");
          renderTransfers();
        });

        // One end of a transfer route. Out-of-area ends are prefixed with the
        // area, muted, so the row reads without ambiguity.
        function routeName(id) {
          const b = document.createElement("b");
          const l = locById(id);
          if (!l) {
            b.textContent = "(removed)";
            return b;
          }
          if (isForeign(l)) {
            const tag = document.createElement("span");
            tag.className = "area-tag";
            tag.textContent = l.area + " · ";
            b.appendChild(tag);
          }
          b.appendChild(document.createTextNode(l.name));
          return b;
        }

        // Newest first: the log is read to find out what just happened.
        // Moves from before timestamps existed sort to the bottom.
        function orderedTransfers() {
          return transfers.slice().sort((a, b) => (b.at || 0) - (a.at || 0));
        }

        function renderTransfers() {
          if (transfers.length === 0) {
            $transfersSection.style.display = "none";
            $transfers.innerHTML = "";
            return;
          }
          $transfersSection.style.display = "";
          $transfersChevron.textContent = transfersExpanded ? "▾" : "▸";
          $transfersCount.textContent = "(" + transfers.length + ")";
          $transfers.style.display = transfersExpanded ? "" : "none";
          $transfers.innerHTML = "";
          if (!transfersExpanded) return;
          for (const t of orderedTransfers()) {
            const row = document.createElement("div");
            row.className = "transfer";

            const when = document.createElement("span");
            when.className = "tr-time";
            if (t.at) {
              const d = new Date(t.at);
              when.textContent = hhmm(d);
              when.title = d.toLocaleString();
            } else {
              when.textContent = "—";
              when.title = "Moved before the log kept times";
            }

            const route = document.createElement("div");
            route.className = "route";
            const f = routeName(t.from);
            const via = document.createElement("span");
            via.className = "via";
            via.textContent = "→";
            const to = routeName(t.to);
            route.appendChild(f);
            route.appendChild(via);
            route.appendChild(to);

            const cnt = document.createElement("span");
            cnt.className = "cnt";
            cnt.innerHTML =
              "<b>" + t.count + "</b> " + (t.count === 1 ? "person" : "people");

            const del = document.createElement("button");
            del.className = "btn-del";
            del.innerHTML = "&times;";
            del.title = "Undo transfer";
            del.addEventListener("click", () => {
              const idx = transfers.indexOf(t);
              transfers = transfers.filter((x) => x.id !== t.id);
              saveTransfers();
              render();
              toast("Sent " + plural(t.count, "person", "people") + " back", {
                label: "Restore",
                action: () => {
                  transfers.splice(Math.min(idx, transfers.length), 0, t);
                  saveTransfers();
                  render();
                },
              });
            });

            row.appendChild(when);
            row.appendChild(route);
            row.appendChild(cnt);
            row.appendChild(del);
            $transfers.appendChild(row);
          }
        }

        /* ---------- Standby teams ---------- */

        function renderTeams() {
          $teams.innerHTML = "";

          if (teams.length === 0) {
            const empty = document.createElement("div");
            empty.className = "teams-empty";
            empty.textContent =
              "No standby teams yet. Add one to keep a group in reserve.";
            $teams.appendChild(empty);
          } else {
            for (const tm of teams) $teams.appendChild(renderTeamRow(tm));
          }

          const add = document.createElement("button");
          add.className = "btn-team";
          add.textContent = "+ Add team";
          add.addEventListener("click", () => {
            teams.push({ id: teamId++, size: 1, location: null });
            saveTeams();
            render();
          });
          $teams.appendChild(add);
        }

        function renderTeamRow(tm) {
          const row = document.createElement("div");
          row.className = "team";

          const size = document.createElement("input");
          size.type = "number";
          size.min = "0";
          size.value = tm.size;
          // The adjacent "employees" text reads as its label but isn't one.
          size.setAttribute("aria-label", "Employees");
          size.addEventListener("input", () => {
            tm.size = Math.max(0, parseInt(size.value, 10) || 0);
            saveTeams();
            refreshComputed();
          });

          const label = document.createElement("span");
          label.className = "mini";
          label.textContent = "employees";

          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "→";

          const select = document.createElement("select");
          // Your own locations sit at the top level; other areas get an
          // optgroup, so a team can be lent out without leaving this row.
          for (const area of areaList()) {
            const inArea = locations.filter((l) => l.area === area);
            if (inArea.length === 0) continue;
            const own = area === myArea;
            const parent = own ? select : document.createElement("optgroup");
            if (!own) parent.label = area;
            for (const loc of inArea) {
              const o = document.createElement("option");
              o.value = String(loc.id);
              o.textContent = loc.name;
              parent.appendChild(o);
            }
            if (!own) select.appendChild(parent);
          }
          const standbyOpt = document.createElement("option");
          standbyOpt.value = "standby";
          standbyOpt.textContent = "Standby";
          select.appendChild(standbyOpt);
          select.value = tm.location == null ? "standby" : String(tm.location);
          select.addEventListener("change", () => {
            tm.location =
              select.value === "standby" ? null : parseInt(select.value, 10);
            saveTeams();
            render();
          });

          const del = document.createElement("button");
          del.className = "btn-del";
          del.innerHTML = "&times;";
          del.title = "Remove team";
          del.addEventListener("click", () => {
            const idx = teams.indexOf(tm);
            teams = teams.filter((x) => x.id !== tm.id);
            saveTeams();
            render();
            toast("Removed standby team", {
              action: () => {
                teams.splice(Math.min(idx, teams.length), 0, tm);
                saveTeams();
                render();
              },
            });
          });

          row.appendChild(size);
          row.appendChild(label);
          row.appendChild(arrow);
          row.appendChild(labelledCell("team-loc", "Assigned to", select));
          row.appendChild(del);
          return row;
        }

        /* ---------- Adding and duplicating locations ---------- */

        function addLocation() {
          const nm = $newName.value.trim();
          if (!nm) return;
          locations.push({
            id: nextId++,
            name: nm,
            area: myArea,
            expanded: true,
            manager: "",
            shifts: [],
            foreign: false,
          });
          $newName.value = "";
          saveLocations();
          render();
          $newName.focus();
        }

        // "Drinks 1" duplicates to "Drinks 2", then "Drinks 3" — a trailing
        // number counts up, anything else gains one. Names only have to be
        // distinct within the area they sit in.
        function uniqueName(base, area) {
          const taken = new Set(
            locations
              .filter((l) => l.area === area)
              .map((l) => l.name.trim().toLowerCase()),
          );
          const m = /^(.*?)(\d+)\s*$/.exec(base.trim());
          const stem = m ? m[1] : base.trim() + " ";
          let n = m ? parseInt(m[2], 10) + 1 : 2;
          let name = stem + n;
          while (taken.has(name.trim().toLowerCase()) && n < 999) {
            n++;
            name = stem + n;
          }
          return name;
        }

        // Setting up twenty near-identical bars by hand on a phone is the worst
        // part of the job. The shift skeleton — times and planned numbers —
        // carries over; actuals start at zero, because nobody is standing at a
        // location that did not exist a second ago.
        function duplicateLocation(loc) {
          const copy = {
            id: nextId++,
            name: uniqueName(loc.name, loc.area),
            area: loc.area,
            expanded: false,
            manager: loc.manager,
            foreign: false,
            shifts: loc.shifts.map((s) => ({
              id: sid++,
              start: s.start,
              end: s.end,
              planned: s.planned,
              actual: 0,
            })),
          };
          locations.splice(locations.indexOf(loc) + 1, 0, copy);
          saveLocations();
          render();
          toast("Added “" + copy.name + "”", {
            action: () => {
              locations = locations.filter((l) => l.id !== copy.id);
              saveLocations();
              render();
            },
          });
        }

        $addBtn.addEventListener("click", addLocation);
        $newName.addEventListener("keydown", (e) => {
          if (e.key === "Enter") addLocation();
        });

        /* ---------- Theme ---------- */

        const root = document.documentElement;

        function effectiveTheme() {
          const attr = root.getAttribute("data-theme");
          if (attr === "light" || attr === "dark") return attr;
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        function updateThemeButton() {
          const t = effectiveTheme();
          $themeBtn.textContent = t === "dark" ? "☾" : "☀";
          $themeBtn.title =
            t === "dark" ? "Switch to light mode" : "Switch to dark mode";
        }

        $themeBtn.addEventListener("click", () => {
          const next = effectiveTheme() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          localStorage.setItem(LS_THEME, next);
          updateThemeButton();
        });

        updateThemeButton();

        /* ---------- Notes ---------- */

        $notes.value = localStorage.getItem(LS_NOTES) || "";
        let notesTimer = null;
        $notes.addEventListener("input", () => {
          clearTimeout(notesTimer);
          notesTimer = setTimeout(
            () => localStorage.setItem(LS_NOTES, $notes.value),
            250,
          );
        });

        /* ---------- Offline and install ---------- */

        // The whole app is one file, so caching the shell is all it takes to
        // work with no signal — and to install to a home screen. An update is
        // offered rather than applied: the page must never reload itself out
        // from under a live count.
        if (
          "serviceWorker" in navigator &&
          location.protocol.startsWith("http")
        ) {
          const hadController = !!navigator.serviceWorker.controller;
          let reloading = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (!hadController || reloading) return;
            reloading = true;
            location.reload();
          });
          window.addEventListener("load", () => {
            navigator.serviceWorker
              .register("./sw.js")
              .then((reg) => {
                function offer(worker) {
                  if (!worker || !hadController) return;
                  toast("A new version is ready.", {
                    label: "Reload",
                    ms: Infinity,
                    action: () => worker.postMessage("SKIP_WAITING"),
                  });
                }
                if (reg.waiting) offer(reg.waiting);
                reg.addEventListener("updatefound", () => {
                  const sw = reg.installing;
                  if (!sw) return;
                  sw.addEventListener("statechange", () => {
                    if (sw.state === "installed") offer(reg.waiting || sw);
                  });
                });
              })
              .catch(() => {});
          });
        }

        $search.value = query;
        render();
      })();
    </script>
  </body>
</html>
